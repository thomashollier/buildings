<text x="704.8000000000001" y="810" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0b0b0b">FRONTAGE 14.400 m</text>
<text x="704.8000000000001" y="826" font-size="11" text-anchor="middle" fill="#52514e"></text>
<text x="100" y="842" font-size="13.5" font-weight="700" fill="#0b0b0b">OFF PITCH — three ways, and only two of them are meant</text>
<text x="100" y="866" font-size="12.5" fill="#52514e"><tspan font-weight="700" fill="#7a4fa8">narrow special</tspan> <tspan font-weight="700" fill="#8b8a85">by DESIGN</tspan> — its band tops out at 1.650 m, below the 2.000 m pitch minimum — the bands cannot overlap</text>
<text x="100" y="888" font-size="12.5" fill="#52514e"><tspan font-weight="700" fill="#eb6834">porte cochère</tspan> <tspan font-weight="700" fill="#8b8a85">by NECESSITY</tspan> — 2.600 clear + 2×0.220 jamb = 3.040 m, wider than most pitches, so it truly displaces the rhythm</text>
<text x="100" y="910" font-size="12.5" fill="#52514e"><tspan font-weight="700" fill="#8b8a85">porte piétonne</tspan> <tspan font-weight="700" fill="#8b8a85">by ACCIDENT</tspan> — 1.750 + 2×0.300 = 2.350 m fits inside a pitch; it broke the rhythm only because it was a rigid slot</text>
<rect x="100" y="942" width="1209.6000000000001" height="86" fill="#f4f2ec" stroke="#e2ded3"/>
<text x="124" y="976" font-size="20" font-weight="700" fill="#0b0b0b">window + pier = pitch</text>
<text x="124" y="1002" font-size="13.5" fill="#52514e">1.300 + 1.338 = 2.638 m &#160;·&#160; count AXES, measure PITCH. Every axis is a bay; every bay carries an opening.</text>
<text x="124" y="1021" font-size="12.5" fill="#8b8a85">A bay takes the rhythm’s pitch unless opening + 2 × jamb will not fit — and only then does that one bay grow.</text>
</svg>