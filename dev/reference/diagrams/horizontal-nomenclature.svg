<svg xmlns="http://www.w3.org/2000/svg" width="1409" height="1210" viewBox="0 0 1409 1210" font-family="Helvetica,Arial,sans-serif">
<rect width="1409" height="1210" fill="#fcfcfb"/>
<text x="100" y="46" font-size="28" font-weight="700" fill="#0b0b0b">Dividing the frontage — what each word names</text>
<text x="100" y="72" font-size="14.5" fill="#52514e">Generated from a live solve: 14.40 m, ordinary class, 10 m street, porte piétonne. Every number is what the solver returned.</text>
<text x="100" y="104" font-size="13.5" font-weight="700" fill="#0b0b0b">EVERY PIECE OF THE FRONTAGE IS A <tspan fill="#0b0b0b">SLOT</tspan>. Four kinds:</text>
<rect x="100" y="119" width="13" height="13" fill="#1baf7a"/>
<text x="122" y="130" font-size="13" fill="#52514e"><tspan font-weight="700" fill="#1baf7a">END</tspan>  <tspan fill="#8b8a85">FLEXIBLE</tspan>  — no opening, no axis. Absorbs leftover width first.</text>
<rect x="100" y="143" width="13" height="13" fill="#2a78d6"/>
<text x="122" y="154" font-size="13" fill="#52514e"><tspan font-weight="700" fill="#2a78d6">BAY</tspan>  <tspan fill="#8b8a85">REPEATING</tspan>  — carries an opening, so it has an AXIS and sets the PITCH.</text>
<rect x="100" y="167" width="13" height="13" fill="#7a4fa8"/>
<text x="122" y="178" font-size="13" fill="#52514e"><tspan font-weight="700" fill="#7a4fa8">NARROW SPECIAL</tspan>  <tspan fill="#8b8a85">FLEXIBLE</tspan>  — off pitch by definition. Not counted as an axis.</text>
<rect x="100" y="191" width="13" height="13" fill="#eb6834"/>
<text x="122" y="202" font-size="13" fill="#52514e"><tspan font-weight="700" fill="#eb6834">ENTRANCE</tspan>  <tspan fill="#8b8a85">FIXED</tspan>  — carries an opening, so it has an AXIS. Off pitch here.</text>
<text x="100" y="225" font-size="13.5" font-weight="700" fill="#0b0b0b">ONE BAY, TAKEN APART — measured centreline to centreline</text>
<rect x="100" y="238" width="56.175000000000004" height="80" fill="#e0d7c6" stroke="#8b8a85"/>
<rect x="156.175" y="238" width="109.2" height="80" fill="#3b4a63"/>
<rect x="265.375" y="238" width="56.175000000000004" height="80" fill="#e0d7c6" stroke="#8b8a85"/>
<text x="128.0875" y="281" font-size="12" font-weight="700" text-anchor="middle" fill="#0b0b0b">half-pier</text>
<text x="128.0875" y="298" font-size="11" text-anchor="middle" fill="#52514e">0.669</text>
<text x="210.775" y="281" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">opening</text>
<text x="210.775" y="298" font-size="11" text-anchor="middle" fill="#dfe6f0">1.300</text>
<text x="293.4625" y="281" font-size="12" font-weight="700" text-anchor="middle" fill="#0b0b0b">half-pier</text>
<text x="293.4625" y="298" font-size="11" text-anchor="middle" fill="#52514e">0.669</text>
<line x1="100" y1="332" x2="321.55" y2="332" stroke="#2a78d6" stroke-width="2.5"/>
<line x1="100" y1="326" x2="100" y2="338" stroke="#2a78d6" stroke-width="2.5"/>
<line x1="321.55" y1="326" x2="321.55" y2="338" stroke="#2a78d6" stroke-width="2.5"/>
<text x="210.775" y="352" font-size="13.5" font-weight="700" text-anchor="middle" fill="#2a78d6">one BAY = one PITCH = 2.638 m</text>
<text x="355.55" y="262" font-size="13" fill="#52514e">So N bays is exactly N × pitch, and the only special case is the two ends.</text>
<text x="355.55" y="283" font-size="13" fill="#52514e">BAY and PITCH are the same number. Prefer PITCH in prose — “bay” names three</text>
<text x="355.55" y="304" font-size="13" fill="#52514e">different things in this codebase.</text>
<text x="100" y="390" font-size="13.5" font-weight="700" fill="#0b0b0b">THE WHOLE FRONTAGE</text>
