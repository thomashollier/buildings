<text x="273.775" y="400" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">AXIS</text>
<text x="509.32500000000005" y="400" font-size="12" fill="#c0392b">one per opening — the thing you COUNT. 5 here.</text>
