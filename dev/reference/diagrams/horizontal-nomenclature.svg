<text x="384.55" y="768" font-size="11" text-anchor="middle" fill="#52514e">wall between two openings</text>
<line x1="100.0" y1="792" x2="1309.6000000000001" y2="792" stroke="#0b0b0b" stroke-width="2"/>
<line x1="100.0" y1="786" x2="100.0" y2="798" stroke="#0b0b0b" stroke-width="2"/>
