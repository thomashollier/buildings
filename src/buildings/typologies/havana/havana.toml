# Old Havana (La Habana Vieja), as rules.
#
# The street fronts of the walled city, 1650-1930, in three manners the date
# chooses and the builder (the seed) dresses:
#   colonial      (to c. 1800) two tall floors, sometimes an entresuelo between,
#                 openings to the floor behind wooden rejas and louvered doors,
#                 a stained-glass mediopunto over each, a long wooden balcony
#                 under a tile tejaroz, the roof's tile alero over all;
#   neoclassical  (c. 1800-1880) three floors, an arcaded portal on a plaza,
#                 iron balconies at each opening, a flat roof behind a cornice
#                 and a balustered pretil;
#   eclectic      (c. 1880-1930) three or four floors, iron or stone balconies,
#                 a heavy cornice and a parapet with a carved crest.
# The fanlights, the rejas and every baluster are grown (havana.mediopunto,
# havana.reja, havana.balusters). Numbers are INFERRED round figures from
# photographs (Plaza Vieja, Calle Obispo, Calle Mercaderes, the Casa de Simon
# Bolivar, Calle Oficios); none is measured.

[style]
name = "havana"
site = ["width", "year", "klass", "seed", "plaza"]
axiom = { w = "width", h = 40 }
overhangs = ["Cornice", "Balcon", "Tejaroz"]
describe = { rule = "havana.manner", phase = "period", detail = "f'Old Havana {manner} front, {width:.1f} m, {year}, {klass}'" }

[lot_props]
year = "= year"

[emit]
Balcon = "havana.balcony"
Rail = "kit.column"
Slat = "kit.column"
Baluster = "kit.column"
Bead = "kit.column"
Slant = "grow.slant"
Hub = "grow.stone"
CrestStone = "grow.stone"
Tejaroz = "kit.cornice"

[params]
# The manner by date, as overlapping odds: [last year, [colonial, neoclassical, eclectic]].
manners = ["colonial", "neoclassical", "eclectic"]
manner_ramp = [[1780, [1.0, 0.0, 0.0]], [1810, [0.7, 0.3, 0.0]], [1860, [0.15, 0.85, 0.0]], [1885, [0.0, 0.7, 0.3]], [9999, [0.0, 0.15, 0.85]]]
# Storeys, as ranges: the colonial floors are the tallest (the heat).
ground_h = { colonial = [5.0, 6.0], neoclassical = [5.0, 5.6], eclectic = [4.6, 5.2] }
upper_h = { colonial = [4.6, 5.4], neoclassical = [4.4, 5.0], eclectic = [3.9, 4.4] }
entresuelo_h = [2.4, 2.9]
uppers = { colonial = [1, 1], neoclassical = [1, 2], eclectic = [2, 3] }
bay = [2.4, 3.0, 3.6]
end = [0.4, 0.7, 1.2]
# Openings run nearly to the ceiling; the mediopunto takes the top of them.
open_w = [1.2, 1.5]
door_w = [2.2, 2.8]             # the zaguan's door, wide enough for a volanta
mediopunto = { colonial = 0.85, neoclassical = 0.75, eclectic = 0.3 }   # share of houses
# Paint, by the builder: pastel stucco.
paints = { stucco_blue = 2, stucco_mint = 1, stucco_yellow = 3, stucco_rose = 2, stucco_peach = 2, plaster_white = 2, stucco_aqua = 1 }
# Balconies: a wooden gallery along the colonial upper floor, iron later.
wood_gallery = 0.7              # colonial houses with a long wooden balcony
p_iron_each = { neoclassical = 0.6, eclectic = 0.5 }   # one at each opening (else a long one)
portal_on_plaza = 0.85          # an arcaded portal on a plaza front
baluster_pitch = 0.13
# More of what a builder chose (variety):
fanlight_patterns = { fan = 3, ring = 2, grid = 2 }   # radial bars, bars and a ring, a vitral grid
persianas = { colonial = 0.6, neoclassical = 0.5, eclectic = 0.35 }   # louvered leaves over the upper openings
slat_pitch = 0.09
louvre_paints = { green = 4, blue = 3, teal = 2, brown = 1 }
pilasters = { colonial = 0.1, neoclassical = 0.55, eclectic = 0.45 }  # an order of pilasters between the bays
bodega = { colonial = 0.15, neoclassical = 0.25, eclectic = 0.45 }    # a shop (bodega) on the ground floor
reja_pitch = 0.12
p_crest = { neoclassical = 0.2, eclectic = 0.7 }

# --- productions -------------------------------------------------------------

[[production]]
id = "havana.lot"
label = "Lot"
doc = "The manner by date; the storeys, the rhythm, the paint and the dress by the builder; the front."
do = [
  { set = { manner = "= draw('manner', manners, step(manner_ramp, year))" } },
  { let = { n_up = "draw('uppers', range(uppers[manner][0], uppers[manner][1] + 1))", entre = "manner == 'colonial' and chance('entresuelo', 0.35)" } },
  { set = { storey_heights = "= [between('ground_h', ground_h[manner][0], ground_h[manner][1])] + ([between('entresuelo_h', entresuelo_h[0], entresuelo_h[1])] if entre else []) + geometric(between('upper_h', upper_h[manner][0], upper_h[manner][1]), 0.95, n_up)", entresuelo = "= entre" } },
  { fit = "x", end = "end", bay = "bay", as = "rhythm", min_bays = 2 },
  { let = { nb = "len(bay_spans(rhythm, 0.0))" } },
  { set = { paint = "= draw('paint', paints)", open_width = "= between('open_w', open_w[0], open_w[1])", door_width = "= between('door_w', door_w[0], door_w[1])", fanlights = "= chance('mediopunto', mediopunto[manner])", gallery = "= manner == 'colonial' and chance('gallery', wood_gallery)", iron_each = "= manner != 'colonial' and chance('iron_each', p_iron_each[manner])", portal = "= plaza and manner != 'eclectic' and chance('portal', portal_on_plaza)", crest = "= manner != 'colonial' and chance('crest', p_crest[manner])", fan_pattern = "= 'ring' if manner == 'colonial' and chance('colonial_ring', 0.6) else draw('fan_pattern', fanlight_patterns)", louvre_paint = "= draw('louvre_paint', louvre_paints)", louvred = "= chance('persianas', persianas[manner])", pilastered = "= chance('pilasters', pilasters[manner])", shop = "= chance('bodega', bodega[manner])", door_bay = "= nb // 2 if (nb % 2 == 1 and chance('door_middle', 0.5)) else draw('door_side', [0, nb - 1])" } },
  { let = { front = "fsum(storey_heights)" } },
  { insert = "Facade", at = ["0.0", "0.0", "w", "front"], name = "facade" },
  # The colonial roof's tile alero; a flat roof's pretil, balustered, and on
  # some a carved crest over the middle.
  { insert = "Pretil", at = ["0.0", "front + (0.7 if manner == 'eclectic' else 0.5)", "w", "1.0"], name = "pretil", when = "manner != 'colonial'" },
  { insert = "Crest", at = ["w / 2.0 - min(3.0, w * 0.3)", "front + (0.7 if manner == 'eclectic' else 0.5) + 1.0", "2 * min(3.0, w * 0.3)", "1.3"], name = "crest_panel", when = "crest" },
]

[[production]]
id = "havana.facade"
label = "Facade"
do = [ { split = "y", id_base = "parent", parts = [ { repeat = "storey_heights", label = "Storey", size = "item", name = "s{i}" } ] } ]

[[production]]
id = "havana.storey"
label = "Storey"
doc = "A floor is cut by the one rhythm; over every opening a mediopunto, before every ground-floor window a reja, along an upper floor its balcony -- each grown, and put up by the storey so it stands in front of the wall."
do = [
  { split = "x", by = "rhythm", label = "Cell" },
  { let = { spans = "bay_spans(rhythm, x)" } },
  # Mediopuntos: the round head of every opening glazed in a fan.
  { each = "range(len(spans))", when = "fanlights and role != 'entresuelo' and not (role == 'ground' and (portal or shop))", do = [
      { let = { sp = "spans[item]", ow = "door_width if (role == 'ground' and item == door_bay) else open_width" } },
      { insert = "Mediopunto", at = ["sp.x + sp.w / 2.0 - ow / 2.0", "y + h - 0.45 - ow / 2.0", "ow", "ow / 2.0"], name = "mediopunto{i}" },
  ] },
  # Rejas: turned wooden bars across a colonial ground window, to the floor.
  { each = "range(len(spans))", when = "role == 'ground' and manner == 'colonial'", do = [
      { let = { sp = "spans[item]" } },
      { insert = "Reja", at = ["sp.x + sp.w / 2.0 - open_width / 2.0 - 0.06", "y + 0.45", "open_width + 0.12", "h - 0.45 - 0.45 - (open_width / 2.0 if fanlights else 0.0) - 0.05"], name = "reja{i}", when = "item != door_bay and not shop" },
  ] },
  # Persianas: louvered wooden leaves over the lower part of each upper opening.
  { each = "range(len(spans))", when = "role == 'upper' and louvred", do = [
      { let = { sp = "spans[item]" } },
      { insert = "Persiana", at = ["sp.x + sp.w / 2.0 - open_width / 2.0", "y + 0.05", "open_width", "h - 0.45 - 0.05 - (open_width / 2.0 if fanlights else 0.0)"], name = "persiana{i}" },
  ] },
  # An order of pilasters between the bays, the full height of the floor.
  { each = "column_lines(rhythm, x, 0.32)", when = "pilastered and not (role == 'ground' and portal)", do = [
      { insert = "Column", at = ["item.x", "y", "item.w", "h - (0.25 if index < count - 1 else 0.0)"], name = "pilaster{i}", attrs = { order = "pilaster" } },
  ] },
  # Balconies on the upper floors: a colonial wooden gallery, or iron.
  { let = { long = "(manner == 'colonial' and gallery) or (manner != 'colonial' and not iron_each)" } },
  { insert = "Balcon", at = ["spans[0].x - 0.2", "y", "spans[-1].x + spans[-1].w - spans[0].x + 0.4", "1.05"], name = "balcon", when = "role == 'upper' and long", attrs = { wood = "= manner == 'colonial'" } },
  { each = "range(len(spans))", when = "role == 'upper' and not long", do = [
      { let = { sp = "spans[item]" } },
      { insert = "Balcon", at = ["sp.x + sp.w / 2.0 - open_width / 2.0 - 0.25", "y", "open_width + 0.5", "1.0"], name = "balcon{i}", attrs = { wood = "= manner == 'colonial'" } },
  ] },
  # The colonial gallery's tile tejaroz over it.
  { insert = "Tejaroz", at = ["spans[0].x - 0.3", "y + h - 0.35", "spans[-1].x + spans[-1].w - spans[0].x + 0.6", "0.35"], name = "tejaroz", attrs = { cornice_ornament = "tiled" }, when = "role == 'upper' and manner == 'colonial' and gallery and index < count - 1" },
  # The colonial roof's tile alero, or the cornice under a flat roof's pretil.
  { insert = "Cornice", at = ["x", "y + h", "w", "0.55"], name = "alero", attrs = { cornice_ornament = "tiled" }, when = "index == count - 1 and manner == 'colonial'" },
  { insert = "Cornice", at = ["x", "y + h", "w", "0.7 if manner == 'eclectic' else 0.5"], name = "cornice", attrs = { cornice_ornament = "modillioned" }, when = "index == count - 1 and manner != 'colonial'" },
  { insert = "Entablature", at = ["x", "y + h - 0.25", "w", "0.25"], name = "band", attrs = { course_kind = "entablature" }, when = "index < count - 1 and manner != 'colonial'" },
]

[[production]]
id = "havana.mediopunto"
label = "Mediopunto"
doc = "A mediopunto, grown: a fan of glazing bars round a small hub, crossed by a ring on some, or a vitral grid of small panes -- the pattern the builder chose."
do = [ { grow = "havana.mediopunto", generations = 2, params = { rays = "max(5, min(9, round(w / 0.22)))", pattern = "fan_pattern", cols = "max(3, round(w / 0.2))", rows = "max(2, round(h / 0.2))" } } ]

[[production]]
id = "havana.persiana"
label = "Persiana"
doc = "A pair of louvered leaves, grown: a frame, the meeting stile, and slats at a steady pitch."
do = [ { grow = "havana.persiana", generations = 2, params = { n = "max(6, round(h / slat_pitch))", paint_of = "louvre_paint" } } ]

[[production]]
id = "havana.reja"
label = "Reja"
doc = "A reja, grown: a rail top and bottom and turned wooden bars between, a bead at their middle."
do = [ { grow = "havana.reja", generations = 2, params = { n = "max(5, round(w / reja_pitch))" } } ]

[[production]]
id = "havana.balcon"
label = "Balcon"
doc = "A balcony's railing, grown: turned wooden balusters on a colonial gallery, iron bars and a rosette on later ones."
do = [ { grow = "havana.balusters", generations = 2, params = { n = "max(4, round(w / baluster_pitch))", timber = "wood" } } ]

[[production]]
id = "havana.pretil"
label = "Pretil"
doc = "The pretil over a flat roof: a balustrade between solid dies."
do = [ { grow = "havana.balustrade", generations = 2, params = { dies = "max(2, round(w / 3.0))" } } ]

[[production]]
id = "havana.crest"
label = "Crest"
doc = "A carved crest over the middle of the pretil: a segmental pediment on a panel."
do = [ { grow = "havana.crest", generations = 1 } ]

[[production]]
id = "havana.cell"
label = "Cell"
when = "opening_type != 'none'"
do = [ { call = "kit.split_cell_around_its_light" } ]

[[production]]
id = "havana.light_bay"
label = "LightBay"
do = [ { call = "kit.split_light_bay" } ]

[[production]]
id = "havana.light"
label = "Light"
do = [ { call = "kit.dress_the_light" } ]

# --- the grown ornament ---------------------------------------------------------

[[lsystem]]
id = "havana.mediopunto"
doc = "A half-round fanlight: radial glazing bars from a hub, and on a colonial one a ring across them."
axiom = "Fan"
rules = [
  { id = "havana.mediopunto.fan", pred = "Fan", when = "pattern == 'fan'", to = "Rays [ Hub ]" },
  { id = "havana.mediopunto.ringed", pred = "Fan", when = "pattern == 'ring'", to = "Rays [ Hub ] Ring" },
  { id = "havana.mediopunto.vitral", pred = "Fan", when = "pattern == 'grid'", to = "Grid [ Hub ]" },
]
interpret = [
  { module = "Rays", each = "range(1, rays)", line = ["cw / 2", "0.02", "cw / 2 + 0.96 * min(cw / 2, ch) * cos(pi() * item / rays)", "0.96 * min(cw / 2, ch) * sin(pi() * item / rays)"], width = "0.02", attrs = { stroke_w = 0.7 } },
  { module = "Hub", do = [ { round = "min(cw, ch) * 0.16", at = ["cw / 2", "0"] }, { outline = "Hub" } ] },
  { module = "Grid", do = [
      { each = "range(1, cols)", line = ["cw * item / cols", "0.01", "cw * item / cols", "ch * 0.98"], width = "0.016", straight = "Slat", attrs = { order = "timber" } },
      { each = "range(1, rows)", line = ["0.0", "ch * item / rows", "cw", "ch * item / rows"], width = "0.016", straight = "Slat", attrs = { order = "timber" } },
  ] },
  { module = "Ring", each = "range(0, 12)", line = ["cw / 2 + 0.55 * min(cw / 2, ch) * cos(pi() * item / 12)", "0.55 * min(cw / 2, ch) * sin(pi() * item / 12)", "cw / 2 + 0.55 * min(cw / 2, ch) * cos(pi() * (item + 1) / 12)", "0.55 * min(cw / 2, ch) * sin(pi() * (item + 1) / 12)"], width = "0.02", attrs = { stroke_w = 0.6 } },
]

[[lsystem]]
id = "havana.persiana"
doc = "Louvered leaves: a frame, a meeting stile down the middle, and slats between."
axiom = "Leaves"
rules = [ { id = "havana.persiana.slatted", pred = "Leaves", to = "Frame Inset [ Ry(n) [ Slat ] ]" } ]
interpret = [
  { module = "Frame", do = [
      { place = "Rail", at = ["0", "0", "0.05", "ch"], attrs = { order = "louvre", louvre_paint = "= paint_of" } },
      { place = "Rail", at = ["cw - 0.05", "0", "0.05", "ch"], attrs = { order = "louvre", louvre_paint = "= paint_of" } },
      { place = "Rail", at = ["cw / 2 - 0.025", "0", "0.05", "ch"], attrs = { order = "louvre", louvre_paint = "= paint_of" } },
  ] },
  { module = "Inset", inset = "[0.05, 0, 0.05, 0]" },
  { module = "Ry(k)", repeat = "y", n = "k" },
  { module = "Slat", place = "Slat", at = ["0", "ch * 0.35", "cw", "ch * 0.3"], attrs = { order = "louvre", louvre_paint = "= paint_of" } },
]

[[lsystem]]
id = "havana.reja"
doc = "A wooden reja: two rails and a row of turned bars, each with a bead."
axiom = "Grille"
rules = [ { id = "havana.reja.barred", pred = "Grille", to = "Rails Inset [ Rx(n) [ Bar ] ]" } ]
interpret = [
  { module = "Rails", do = [
      { place = "Rail", at = ["0", "0", "cw", "0.06"], attrs = { order = "timber" } },
      { place = "Rail", at = ["0", "ch - 0.06", "cw", "0.06"], attrs = { order = "timber" } },
  ] },
  { module = "Inset", inset = "[0, 0.06, 0, 0.06]" },
  { module = "Rx(k)", repeat = "x", n = "k" },
  { module = "Bar", do = [
      { place = "Baluster", at = ["cw / 2 - 0.018", "0", "0.036", "ch"], attrs = { order = "timber" } },
      { place = "Bead", at = ["cw / 2 - 0.035", "ch / 2 - 0.05", "0.07", "0.1"], attrs = { order = "timber" } },
  ] },
]

[[lsystem]]
id = "havana.balusters"
doc = "A balcony railing: a handrail and a bottom rail, and balusters -- turned wood, or iron bars with a rosette between each pair."
axiom = "Railing"
rules = [
  { id = "havana.balusters.railed", pred = "Railing", to = "Rails Inset [ Rx(n) [ Post ] ]" },
]
interpret = [
  { module = "Rails", do = [
      { place = "Rail", at = ["0", "ch - 0.07", "cw", "0.07"], attrs = { order = "timber" } },
      { place = "Rail", at = ["0", "0", "cw", "0.06"], attrs = { order = "timber" } },
  ] },
  { module = "Inset", inset = "[0, 0.06, 0, 0.07]" },
  { module = "Rx(k)", repeat = "x", n = "k" },
  { module = "Post", do = [
      { when = "timber", place = "Baluster", at = ["cw / 2 - 0.025", "0", "0.05", "ch"], attrs = { order = "timber" } },
      { when = "timber", place = "Bead", at = ["cw / 2 - 0.045", "ch * 0.3", "0.09", "0.12"], attrs = { order = "timber" } },
      { when = "not timber", place = "Baluster", at = ["cw / 2 - 0.012", "0", "0.024", "ch"], attrs = { order = "timber" } },
      { when = "not timber", place = "Bead", at = ["cw / 2 - 0.04", "ch / 2 - 0.04", "0.08", "0.08"], attrs = { order = "timber" } },
  ] },
]

[[lsystem]]
id = "havana.balustrade"
doc = "A pretil: a coping and a plinth, solid dies at a steady pitch, stone balusters between."
axiom = "Pretil"
rules = [
  { id = "havana.balustrade.dies", pred = "Pretil", to = "Coping Inset [ Rx(dies) [ Bay ] ]" },
  { id = "havana.balustrade.bay", pred = "Bay", to = "Die Fill" },
]
interpret = [
  { module = "Coping", do = [
      { place = "Rail", at = ["0", "ch - 0.12", "cw", "0.12"], attrs = { order = "corner_board" } },
      { place = "Rail", at = ["0", "0", "cw", "0.1"], attrs = { order = "corner_board" } },
  ] },
  { module = "Inset", inset = "[0, 0.1, 0, 0.12]" },
  { module = "Rx(k)", repeat = "x", n = "k" },
  { module = "Die", place = "Rail", at = ["0", "0", "0.32", "ch"], attrs = { order = "corner_board" } },
  { module = "Fill", each = "range(max(3, int((cw - 0.32) / 0.22)))", place = "Baluster", at = ["0.32 + (item + 0.5) * (cw - 0.32) / max(3, int((cw - 0.32) / 0.22)) - 0.05", "0", "0.1", "ch"], attrs = { order = "corner_board" } },
]

[[lsystem]]
id = "havana.crest"
doc = "A crest: a panel under a segmental pediment."
axiom = "Crest"
rules = [ { id = "havana.crest.panel", pred = "Crest", to = "Panel" } ]
interpret = [
  { module = "Panel", polygon = "CrestStone", points = "[[0, 0], [0, ch * 0.55], [cw * 0.15, ch * 0.62], [cw * 0.3, ch * 0.82], [cw * 0.5, ch], [cw * 0.7, ch * 0.82], [cw * 0.85, ch * 0.62], [cw, ch * 0.55], [cw, 0]]" },
]

# --- rules ---------------------------------------------------------------------

[[layer]]
name = "roles"
order = 0

[[layer]]
name = "base"
order = 0

[[rule]]
id = "havana.roles.floor"
label = "Storey"
layer = "roles"
doc = "The ground floor, the entresuelo where there is one, the upper floors; one pastel for the whole front."
set = { role = "= 'ground' if index == 0 else 'entresuelo' if (entresuelo and index == 1) else 'upper'", wall_material = "= paint" }

[[rule]]
id = "havana.base.end_piers_are_wall"
label = "Cell"
when = "not is_bay()"
set = { opening_type = "none" }

[[rule]]
id = "havana.base.an_opening_to_the_floor"
label = "Cell"
doc = "Every bay opens nearly floor to ceiling, under a round head where the house has mediopuntos, louvered on the upper floors."
when = "is_bay() and role in ('ground', 'upper')"
set = { opening_type = "window", glazing = "= 'scuri' if (manner == 'colonial' and role == 'upper' and chance('louvres', 0.6, per='Lot')) else 'sash'", frame_paint = "white", sash_cols = 2, sash_rows = 3, head = "= 'round' if fanlights else 'flat'", light_width = "= min(open_width, w - 0.5)", sill = "= 0.45 if role == 'ground' else 0.05", light_height = "= h - 0.45 - (0.45 if role == 'ground' else 0.05)", surround_kind = "= 'moulded_architrave' if manner != 'colonial' else 'bare_band'", keystone_present = "= manner != 'colonial'" }

[[rule]]
id = "havana.base.entresuelo_lights"
label = "Cell"
doc = "The entresuelo is lit by low square windows."
when = "is_bay() and role == 'entresuelo'"
set = { opening_type = "window", head = "flat", light_width = "= min(open_width * 0.8, w - 0.6)", sill = 0.5, light_height = "= h - 0.5 - 0.6", surround_kind = "bare_band", keystone_present = false }

[[rule]]
id = "havana.base.a_bodega"
label = "Cell"
doc = "Where the builder let the ground floor as a bodega, its bays are shop openings to the pavement."
when = "is_bay() and role == 'ground' and shop and not portal"
specificity = 10
set = { opening_type = "shop_bay", head = "flat", light_width = "= min(open_width + 0.6, w - 0.4)", sill = 0.0, light_height = "= h - 0.9", surround_kind = "moulded_architrave", keystone_present = false }

[[rule]]
id = "havana.base.the_zaguan_door"
label = "Cell"
doc = "One bay of the ground floor is the zaguan's door, wide enough for a carriage, in a stone frame."
when = "is_bay() and role == 'ground' and nth - 1 == door_bay and not portal"
specificity = 20
set = { opening_type = "pedestrian_entrance", head = "= 'round' if fanlights else 'flat'", light_width = "= min(door_width, w - 0.3)", sill = 0.0, light_height = "= h - 0.45", surround_kind = "moulded_architrave", keystone_present = true }

[[rule]]
id = "havana.base.the_portal"
label = "Cell"
doc = "On a plaza the ground floor is a portal: an arcade of round arches open to the street."
when = "is_bay() and role == 'ground' and portal"
specificity = 30
set = { opening_type = "open_arch", head = "round", light_width = "= w - 0.5", sill = 0.0, light_height = "= h - 0.35", surround_kind = "moulded_architrave", keystone_present = true }
