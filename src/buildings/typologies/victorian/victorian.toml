# The San Francisco Victorian, as rules.
#
# A timber row house on the 25-foot lot of the 1870s-1890s. Every floor is
# cut into the bay window's zone and the entry's; over the raised basement the
# bay projects as three faces, and how much of it the two angled faces take is
# the one number between a slanted Italianate bay and a square Stick one.
# The date chooses the type. Everything else a builder chose is a weighted
# draw (``draw``/``chance``/``pick``): the layout, the bay's shape, the top and
# the paint once per house; the window heads, hoods, glazing and belt courses
# once per floor -- so every floor of a house matches itself, two floors may
# differ, and the parlour floor is weighted to be the richer.
# Numbers are INFERRED round figures (Alamo Square, the Mission).

[style]
name = "victorian"
site = ["year", "klass", "seed", "width"]
axiom = { w = "width", h = 30 }
overhangs = ["Cornice"]
describe = { rule = "victorian.victorian_type", phase = "period", detail = "f'San Francisco {kind} row house, {year}, {klass}'" }

[lot_props]
year = "= year"

[emit]
Top = "victorian.top"
Turret = "victorian.turret"
Stoop = "victorian.stoop"
Patio = "victorian.fence"
Shingle = "grow.stone"
SunDisc = "grow.stone"
Slant = "grow.slant"
Spindle = "kit.column"
Bead = "kit.column"
Rail = "kit.column"

[params]
# Storey heights as ranges (fidelity review R-8: observer 1.8-2.7 / 3.8-4.6 /
# 3.4-4.0 m from riser counts and a 12 ft parlour ceiling).
basement_h = [2.25, 2.7]      # photo check: sidewalk to cornice 11.1-12.0 m on 21 Italianates
parlour_h = [4.0, 4.2]
chamber_h = [3.5, 3.7]
third_h = 3.3
# The type by date as an overlapping ramp, not hard cuts (R-6, Bulletin 18):
# [last year, [italianate, stick, queen_anne]].
kind_ramp = [[1877, [1, 0, 0]], [1879, [0.9, 0.1, 0]], [1881, [0.7, 0.3, 0]], [1883, [0.5, 0.5, 0]], [1885, [0.3, 0.65, 0.05]], [1887, [0.1, 0.6, 0.3]], [1889, [0, 0.45, 0.55]], [1891, [0, 0.25, 0.75]], [9999, [0, 0.1, 0.9]]]
kinds = ["italianate", "stick", "queen_anne"]
# A third storey is rare (R-4: Liberty Street 1 in ~30); rich houses more often.
third_storey = { modest = 0.03, ordinary = 0.03, comfortable = 0.10, grand = 0.50 }
# How much of the bay zone each angled face takes, by the bay's shape: an
# Italianate half-octagon is one window per face (R-2: 0.25).
side_share = { slanted = 0.25, square = 0.07 }
# The bay's shape by type: Italianate slanted, Stick square, Queen Anne either.
bay_forms = { italianate = { slanted = 4, square = 1 }, stick = { square = 4, slanted = 1 }, queen_anne = { slanted = 1, square = 1 } }
# Per-floor dress by type: [option, weight on the parlour floor, weight above].
# Photo check (21 Italianates): heads are a per-house choice -- round 0.55,
# segmental 0.25, flat 0.20 -- the same on every floor.
heads = { italianate = [["round", 0.55, 0.55], ["segmental", 0.25, 0.25], ["flat", 0.2, 0.2]], stick = [["flat", 4, 4], ["segmental", 1, 1]], queen_anne = [["flat", 3, 3], ["round", 1, 1]] }
# Italianate hoods (O-3): pediments 0.45, arched hood mould 0.45, flat 0.1.
hoods = { italianate = [["pedimented", 0.55, 0.35], ["moulded_architrave", 0.4, 0.5], ["bare_band", 0.05, 0.15]], stick = [["moulded_architrave", 2, 2], ["bare_band", 1, 2]], queen_anne = [["bare_band", 2, 3], ["moulded_architrave", 1, 1]] }
belts = { italianate = { entablature = 2, dentil = 1 }, stick = { entablature = 1, plat_bande = 1 }, queen_anne = { dentil = 1, entablature = 1 } }
paints = ["clapboard_sage", "clapboard_blue", "clapboard_cream", "clapboard_rose"]
corner_orders = { corner_board = 3, corinthian = 1 }
corner_board = 0.14
extra_floor = 3.1               # a second chamber floor
patio_w = 1.3                   # a side yard behind a fence, beside the entry
# Grown ornament (victorian.shingles, victorian.sunburst, victorian.spindles).
shingle_band = 0.7              # a band of fish-scale shingles across the gable's foot
scale_w = 0.16                  # one shingle, butt to butt
spindle_pitch = 0.11
spindle_w = 0.035
stoop_w = [1.4, 1.8]            # a wooden stair, front-on, under a single door (photo check)
stoop_w_pair = [1.9, 2.5]       # under paired leaves
riser = 0.18
# The door hood by type (R-3): [option, weight].
# Italianate entry (photo check): console hood 0.35, framed recess 0.35,
# columned portico 0.30 (0.8 grand) -- drawn as hood, pediment, pediment.
door_hoods = { italianate = { moulded_architrave = 0.35, pedimented = 0.65 }, stick = { pedimented = 0.8, moulded_architrave = 0.2 }, queen_anne = { moulded_architrave = 0.5, pedimented = 0.4, bare_band = 0.1 } }
# The layouts a lot of its width allows. The seed stands for the builder.
#   single_left / single_right: one bay window, the entry beside it
#   double: a bay either side of a central entry, on a wide lot

# --- productions -------------------------------------------------------------

[[production]]
id = "victorian.lot"
label = "Lot"
doc = "The house front, its layout, what crowns it, the stoop up to the door, and a side yard where the builder left one."
do = [
  { set = { kind = "= draw('kind', kinds, step(kind_ramp, year))" } },
  { set = { door_pair = "= chance('door_pair', 0.7 if kind == 'italianate' else 0.3)", it_pair = "= kind == 'italianate' and chance('it_pair', 0.15)", base_h = "= between('basement_h', basement_h[0], basement_h[1])", layout = "= 'double' if (w >= 12.0 or (klass == 'grand' and w >= 10.5)) and kind == 'italianate' else draw('layout', ['single_left', 'single_right'])", bay_share = "= between('bay_share', 0.45, 0.56)", bay_form = "= draw('bay_form', bay_forms[kind])", paint = "= draw('paint', paints)", corner_order = "= draw('corner_order', corner_orders)" } },
  { set = { storey_heights = "= [base_h, between('parlour_h', parlour_h[0], parlour_h[1]), between('chamber_h', chamber_h[0], chamber_h[1])] + ([third_h] if chance('third_storey', third_storey[klass]) else [])" } },
  { let = { patio = "patio_w if (layout != 'double' and w >= 6.8 and chance('patio', 0.5 if (w >= 10 or klass == 'grand') else 0.10)) else 0.0" } },
  # The facade stands beside the side yard, which is on the entry's side.
  { let = { fx = "patio if layout == 'single_right' else 0.0", fw = "w - patio", front = "fsum(storey_heights)" } },
  { set = { bay_x = "= fx + fw * (1 - bay_share) if layout == 'single_right' else fx", bay_w = "= fw * (0.36 if layout == 'double' else bay_share)", entry_x = "= fx if layout == 'single_right' else fx + fw * (0.36 if layout == 'double' else bay_share)", entry_w = "= fw * (0.28 if layout == 'double' else 1 - bay_share)" } },
  # With a turret over the bay, the gable crowns only the rest of the front.
  { let = { turret = "kind == 'queen_anne' and chance('turret', 0.4 if klass == 'grand' else 0.25 if klass == 'comfortable' else 0.15)", bay_right = "layout == 'single_right'", gable_h = "0.62 * fw" } },
  { insert = "Facade", at = ["fx", "0.0", "fw", "front"], name = "facade" },
  { insert = "Top", at = ["fx", "front", "fw", "between('false_front', 1.3, 1.8) if kind != 'queen_anne' else gable_h"], name = "top", attrs = { kind = "= kind" }, when = "not turret" },
  { insert = "Top", at = ["fx if bay_right else bay_x + bay_w", "front", "(bay_x - fx) if bay_right else (fx + fw - bay_x - bay_w)", "max(3.0, 0.62 * ((bay_x - fx) if bay_right else (fx + fw - bay_x - bay_w)))"], name = "top", attrs = { kind = "= kind" }, when = "turret" },
  { insert = "Turret", at = ["bay_x + 0.15", "front - storey_heights[-1]", "bay_w - 0.3", "storey_heights[-1] + 2.6 + 3.2"], name = "turret", when = "turret" },
  # A wooden stair seen front-on, centred under the door (R-1).
  { let = { sw = "min(entry_w - 0.3, between('stoop_w', stoop_w_pair[0], stoop_w_pair[1]) if door_pair else between('stoop_w', stoop_w[0], stoop_w[1]))" } },
  { insert = "Stoop", at = ["entry_x + entry_w / 2.0 - sw / 2.0", "0.0", "sw", "base_h"], name = "stoop", attrs = { risers = "= max(5, round(base_h / riser))" } },
  { insert = "Patio", at = ["(0.0 if bay_right else fx + fw) + 0.1", "0.0", "patio - 0.2", "1.8"], name = "patio", when = "patio > 0" },
]

[[production]]
id = "victorian.facade"
label = "Facade"
doc = "Basement, parlour, a chamber floor or two."
do = [ { split = "y", id_base = "parent", parts = [ { repeat = "storey_heights", label = "Storey", size = "item", name = "s{i}" } ] } ]

[[production]]
id = "victorian.storey"
label = "Storey"
do = [
  # A facade floor is cut by the layout: the bay's zone and the entry's.
  { split = "x", when = "role not in ('parapet', 'attic', 'turret') and layout == 'single_left'", parts = [
      { label = "BayZone", size = "w * bay_share", name = "bay_zone" },
      { label = "EntryZone", size = "w - w * bay_share", name = "entry" },
  ] },
  { split = "x", when = "role not in ('parapet', 'attic', 'turret') and layout == 'single_right'", parts = [
      { label = "EntryZone", size = "w * (1 - bay_share)", name = "entry" },
      { label = "BayZone", size = "w - w * (1 - bay_share)", name = "bay_zone" },
  ] },
  { split = "x", when = "role not in ('parapet', 'attic', 'turret') and layout == 'double'", parts = [
      { label = "BayZone", size = "w * 0.36", name = "bay_zone" },
      { label = "EntryZone", size = "w * 0.28", name = "entry" },
      { label = "BayZone", size = "w - w * 0.36 - w * 0.28", name = "bay_zone_2" },
  ] },
  # A rare third storey is cut like the others: the bay rises through it (the
  # blind judges failed a bay that stopped a floor short of the cornice).
  # The false front: boards over a frieze and a bracketed cornice.
  { split = "x", when = "role == 'parapet'", parts = [ { label = "Cell", size = "w", name = "x0", slot = "end" } ] },
  { insert = "Entablature", at = ["x", "y + h - 0.5", "w", "0.5"], name = "frieze", attrs = { course_kind = "entablature" }, when = "role == 'parapet'" },
  { insert = "Cornice", at = ["x", "y + h", "w", "0.6"], name = "cornice", attrs = { cornice_ornament = "bracketed" }, when = "role == 'parapet'" },
  # The gable's attic and the turret's room: one window between two walls.
  { split = "x", when = "role in ('attic', 'turret')", parts = [
      { label = "Cell", size = "w * 0.2", name = "x0", slot = "end" },
      { label = "Cell", size = "w * 0.6", name = "x1", slot = "bay" },
      { label = "Cell", size = "w * 0.2", name = "x2", slot = "end" },
  ] },
]

[[production]]
id = "victorian.bay_zone"
label = "BayZone"
doc = "Over the basement the bay projects: three faces, its angled sides as wide as the type makes them, a corner board at every arris."
do = [
  { split = "x", when = "role == 'basement'", parts = [
      { label = "Cell", size = "w * 0.3", name = "x0", slot = "end" },
      { label = "Cell", size = "w * 0.4", name = "x1", slot = "bay" },
      { label = "Cell", size = "w * 0.3", name = "x2", slot = "end" },
  ] },
  # Photo check: an Italianate half-octagon's side faces take 0.29 of the bay.
  { let = { side = "w * (0.29 if kind == 'italianate' and bay_form == 'slanted' else side_share[bay_form])" } },
  { split = "x", when = "role != 'basement'", parts = [
      { label = "Cell", size = "side", name = "x0", slot = "bay", attrs = { face = "side" } },
      { label = "Cell", size = "w - 2 * side", name = "x1", slot = "bay", attrs = { face = "front" } },
      { label = "Cell", size = "side", name = "x2", slot = "bay", attrs = { face = "side" } },
  ] },
  # Stick and Queen Anne bays carry a frieze of turned spindles under the cornice.
  { insert = "Spindles", at = ["x", "y + h - 0.32 - 0.2", "w", "0.2"], name = "spindles", when = "role != 'basement' and kind != 'italianate'" },
  { insert = "Entablature", at = ["x", "y + h - 0.32", "w", "0.32"], name = "bay_cornice", attrs = { course_kind = "= draw('belt', belts[kind], per='Storey')" }, when = "role != 'basement'" },
  { each = "[x, x + side, x + w - side, x + w]", when = "role != 'basement'", do = [
      { insert = "Column", at = ["min(max(item - corner_board / 2.0, x), x + w - corner_board)", "y", "corner_board", "h - 0.32"], name = "corner{i}", attrs = { order = "= corner_order" } },
  ] },
]

[[production]]
id = "victorian.entry_zone"
label = "EntryZone"
doc = "The entry column: the door on the parlour floor, a window over it, a small window into the basement under the stoop."
do = [ { split = "x", parts = [
    { label = "Cell", size = "0.3", name = "x0", slot = "end" },
    { label = "Cell", size = "w - 0.6", name = "x1", slot = "bay" },
    { label = "Cell", size = "0.3", name = "x2", slot = "end" },
] } ]

[[production]]
id = "victorian.top"
label = "Top"
doc = "A Queen Anne front ends in a gable with a window in it; the others in a false front, a parapet of boards over a bracketed cornice."
do = [
  { let = { aw = "(min(w * 0.36, 1.8) if w > 5 else w * 0.5)", qa = "kind == 'queen_anne'" } },
  # A Queen Anne gable: a band of fish-scale shingles across its foot, the
  # attic window over it, and a sunburst in the apex -- each grown.
  { let = { band = "min(shingle_band, h * 0.18)", ah = "min(1.6, h * 0.42)" } },
  { insert = "Shingles", at = ["x + w * 0.1", "y + 0.05", "w * 0.8", "band"], name = "shingles", when = "qa" },
  { insert = "Storey", at = ["x + (w - aw) / 2.0", "y + band + 0.15", "aw", "ah"], name = "attic", attrs = { role = "attic" }, when = "qa" },
  { let = { t0 = "band + 0.15 + ah + 0.15" } },
  { let = { half = "(w / 2.0) * (1 - (t0 + 0.05) / h) * 0.8" } },
  { insert = "Sunburst", at = ["x + w / 2.0 - half", "y + t0", "2 * half", "half"], name = "sunburst", when = "qa and half > 0.35" },
  { insert = "Storey", at = ["x", "y", "w", "h"], name = "false_front", attrs = { role = "parapet" }, when = "kind != 'queen_anne'" },
]

[[production]]
id = "victorian.shingles"
label = "Shingles"
doc = "A band of fish-scale shingles, grown: rows of half-round butts hanging across the gable's foot."
do = [ { grow = "victorian.shingles", generations = 2, params = { n = "max(2, round(w / scale_w))", rows = "max(1, int(h / (w / max(2, round(w / scale_w)) * 0.5)))" } } ]

[[production]]
id = "victorian.sunburst"
label = "Sunburst"
doc = "A sunburst panel in the gable's apex, grown: a half-disc and its rays."
do = [ { grow = "victorian.sunburst", generations = 1, params = { rays = "max(5, min(11, round(w / 0.18)))" } } ]

[[production]]
id = "victorian.spindles"
label = "Spindles"
doc = "A spindle frieze, grown: a rail, then turned spindles at a steady pitch, a bead on each."
do = [ { grow = "victorian.spindles", generations = 2, params = { n = "max(3, round(w / spindle_pitch))" } } ]

[[lsystem]]
id = "victorian.shingles"
doc = "Fish-scale shingles: rows of round butts."
axiom = "Band"
rules = [
  { id = "victorian.shingles.rows", pred = "Band", to = "Ry(rows) [ Row ]" },
  { id = "victorian.shingles.scales", pred = "Row", to = "Rx(n) [ Scale ]" },
]
interpret = [
  { module = "Ry(k)", repeat = "y", n = "k" },
  { module = "Rx(k)", repeat = "x", n = "k" },
  { module = "Scale", do = [ { round = "min(cw * 0.5, ch) - 0.003", at = ["cw / 2", "ch"] }, { outline = "Shingle" } ] },
]

[[lsystem]]
id = "victorian.sunburst"
doc = "A sunburst: a half-disc on its base and rays fanning from the base's middle."
axiom = "Sun"
rules = [ { id = "victorian.sunburst.rays", pred = "Sun", to = "[ Disc ] Rays" } ]
interpret = [
  { module = "Disc", do = [ { round = "min(cw / 2, ch)", at = ["cw / 2", "0"] }, { outline = "SunDisc" } ] },
  { module = "Rays", each = "range(1, rays)", line = ["cw / 2", "0.01", "cw / 2 + 0.92 * min(cw / 2, ch) * cos(pi() * item / rays)", "0.92 * min(cw / 2, ch) * sin(pi() * item / rays)"], width = "0.02", attrs = { stroke_w = 0.8 } },
]

[[lsystem]]
id = "victorian.spindles"
doc = "A spindle frieze: a rail along the top, then a row of turned spindles each with a bead."
axiom = "Frieze"
rules = [
  { id = "victorian.spindles.railed", pred = "Frieze", to = "Rail Inset [ Rx(n) [ Spindle ] ]" },
]
interpret = [
  { module = "Rail", place = "Rail", at = ["0", "ch - 0.04", "cw", "0.04"], attrs = { order = "timber" } },
  { module = "Inset", inset = "[0, 0, 0, 0.04]" },
  { module = "Rx(k)", repeat = "x", n = "k" },
  { module = "Spindle", do = [
      { place = "Spindle", at = ["cw / 2 - spindle_w / 2", "0", "spindle_w", "ch"], attrs = { order = "timber" } },
      { place = "Bead", at = ["cw / 2 - spindle_w", "ch / 2 - spindle_w", "2 * spindle_w", "2 * spindle_w"], attrs = { order = "timber" } },
  ] },
]

[[production]]
id = "victorian.turret"
label = "Turret"
doc = "A corner turret rises out of the bay through the chamber floor and a storey of its own, under a conical roof."
do = [ { insert = "Storey", at = ["x", "y + storey_heights[-1]", "w", "2.6"], name = "storey", attrs = { role = "turret" } } ]

[[production]]
id = "victorian.cell"
label = "Cell"
when = "opening_type != 'none'"
do = [ { call = "kit.split_cell_around_its_light" } ]

[[production]]
id = "victorian.light_bay"
label = "LightBay"
do = [
  { call = "kit.split_light_bay_into_lights", when = "has('lights') and lights" },
  { call = "kit.split_light_bay", when = "not (has('lights') and lights)" },
]

[[production]]
id = "victorian.light"
label = "Light"
do = [ { call = "kit.dress_the_light" } ]

# --- rules ---------------------------------------------------------------------

[[layer]]
name = "roles"
order = 0

[[layer]]
name = "base"
order = 0

[[rule]]
id = "victorian.roles.floor_and_paint"
label = "Storey"
layer = "roles"
doc = "Basement, parlour, chamber -- or the role a crowning storey was given -- and one paint for the whole house, chosen by its seed."
set = { role = "= role if has('role') else ['basement', 'parlour', 'chamber', 'third'][index]", wall_material = "= paint" }

[[rule]]
id = "victorian.base.wall"
label = "Cell"
when = "not is_bay()"
set = { opening_type = "none" }

[[rule]]
id = "victorian.base.a_narrow_return_is_blank"
label = "Cell"
doc = "A square bay's return seen in elevation is a sliver under half a metre: blank boards, not a window (V-BAY-2)."
when = "is_bay() and has('face') and face == 'side' and w < 0.5"
specificity = 20
set = { opening_type = "none" }

[[rule]]
id = "victorian.base.basement_light"
label = "Cell"
when = "is_bay() and role == 'basement'"
set = { opening_type = "window", head = "flat", light_width = "= w * 0.8", sill = 0.8, light_height = 0.8, surround_kind = "none", keystone_present = false }

[[rule]]
id = "victorian.base.a_tall_sash"
label = "Cell"
doc = "Every face and every opening bay holds a tall sash. Its head, hood and glazing are drawn once per floor from the type's weights -- the parlour floor weighted to the richer dress -- so a floor always matches itself."
when = "is_bay() and role != 'basement'"
let = { living = "role in ('parlour', 'chamber', 'third')", front = "has('face') and face == 'front'", col = "1 if role == 'parlour' else 2" }
set = { opening_type = "window", head = "= draw('head', column(heads[kind], 0), column(heads[kind], col), per='Lot' if kind == 'italianate' else 'Storey')", light_width = "= max(0.3, ((min(w - 0.45, 1.15) if kind == 'italianate' else w - 0.45) if front else min(w - 0.3, 1.1)))", sill = "= 0.55 if living else 0.4", light_height = "= h - (0.55 if living else 0.4) - (0.55 if living else 0.35)", surround_kind = "= draw('hood', column(hoods[kind], 0), column(hoods[kind], col), per='Storey')", keystone_present = "= kind == 'italianate' and chance('keystone', 0.6, per='Storey')", glazing = "sash", frame_paint = "white", sash_cols = "= draw('panes', [1, 2], [1, 2], per='Storey')", sash_rows = 1 }

[[rule]]
id = "victorian.base.a_pair_in_the_front_face"
label = "Cell"
doc = "A Stick or Queen Anne bay's wide front face often takes a pair of sashes, and a round-headed floor always does; an Italianate half-octagon has one window per face (V-BAY-1)."
when = "is_bay() and role != 'basement' and has('face') and face == 'front' and w > 1.4 and ((kind == 'italianate' and it_pair) or (kind != 'italianate' and w > 2.2 and (chance('pair', 0.7, per='Storey') or draw('head', column(heads[kind], 0), column(heads[kind], 1 if role == 'parlour' else 2), per='Storey') == 'round')))"
set = { lights = "= (1.0, 1.0)", divider = "Mullion", divider_width = 0.16 }

[[rule]]
id = "victorian.base.the_door_at_the_top_of_the_stoop"
label = "Cell"
doc = "The parlour floor's entry bay is the front door, under a transom."
when = "is_bay() and role == 'parlour' and in_parent('EntryZone')"
specificity = 10
set = { opening_type = "pedestrian_entrance", head = "= 'segmental' if kind == 'italianate' else 'flat'", light_width = "= 1.3 if door_pair else 1.0", sill = 0.0, light_height = "= h - 0.7", lights = "= None", surround_kind = "= draw('door_hood', door_hoods[kind])", keystone_present = "= kind == 'italianate'" }
