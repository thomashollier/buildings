# The Normandy half-timbered house, as rules.
#
# Colombage: an oak frame whose members show on the face of the wall, the
# panels between filled with ochre torchis. The frame is a grammar laid over
# the openings: posts at a fixed spacing across every storey, a post either
# side of every window, none across it, a brace in each end panel, and a
# Saint Andrew's cross in the breast under each upper window.
#  town    (Rouen, Honfleur): narrow, three storeys, each jettied out past the
#          one below, the gable to the street;
#  country (Pays d'Auge): long and low, posts close-set, a knee-wall loft,
#          a steep thatched roof with dormers.
# Numbers are INFERRED round figures for the type.

[style]
name = "normandy"
site = ["setting", "year", "klass", "seed", "width"]
axiom = { w = "width if width is not None else (6.2 if setting == 'town' else 14.0)", h = 30 }
overhangs = ["Chimney"]
describe = { rule = "normandy.colombage", phase = "structure", detail = "f'Normandy half-timbered house, {setting}, {w:.1f} m, {year}'" }

[lot_props]
year = "= year"

[emit]
Post = "kit.column"
Brace = "normandy.brace"
Gable = "normandy.gable"

[params]
post = 0.15              # an oak post's face
jetty = 0.25             # how far a jettied storey stands out past the one below
plate = 0.18
gable_h = 4.2            # a 55-60 degree town gable over a 6 m front
roof_h = 5.6             # a thatched Pays d'Auge roof, about 60 degrees
frame_end = [0.45, 0.8, 1.6]
loft_band = [0.9, 1.2, 1.6]
settings = { town = { heights = [3.1, 2.8, 2.6], spacing = 0.55, band = [1.3, 1.6, 2.0] }, country = { heights = [2.7, 1.3], spacing = 0.36, band = [1.8, 2.2, 2.8] } }

# --- productions -------------------------------------------------------------

[[production]]
id = "normandy.lot"
label = "Lot"
doc = "The frame's storeys, and over them a gable to the street in town or a great thatched roof in the country."
let = { front = "fsum(settings[setting].heights)" }
do = [
  { insert = "Facade", at = ["0.0", "0.0", "w", "front"], name = "facade" },
  { insert = "Gable", at = ["0.0", "front", "w", "gable_h"], name = "gable", when = "setting == 'town'" },
  { insert = "Roof", at = ["0.0", "front", "w", "roof_h"], name = "roof", attrs = { pitch = 60.0, roof_material = "thatch", dormer_form = "flat_lucarne" }, when = "setting != 'town'" },
]

[[production]]
id = "normandy.facade"
label = "Facade"
doc = "The storeys, bottom-up; in town each stands out past the one below."
do = [ { split = "y", parts = [ { repeat = "settings[setting].heights", label = "Floor", size = "item", name = "floor{i}" } ] } ]

[[production]]
id = "normandy.floor"
label = "Floor"
doc = "A floor holds a storey as wide as its jetties allow: the top one the whole front, each one under it a jetty narrower on either side."
let = { inset = "jetty * (count - 1 - index) if setting == 'town' else 0.0" }
do = [ { insert = "Storey", at = ["x + inset", "y", "w - 2 * inset", "h"], name = "storey", attrs = { floor_index = "= index" } } ]

[[production]]
id = "normandy.storey"
label = "Storey"
doc = "A storey is fitted with its own bays, framed top and bottom by plates; a jettied storey's sill beam shows its joist ends."
do = [
  { fit = "x", end = "frame_end", bay = "loft_band if role == 'loft' and setting == 'town' else settings[setting].band", as = "rhythm" },
  { split = "x", by = "rhythm", label = "Cell" },
  { insert = "Entablature", at = ["x", "y + h - plate", "w", "plate"], name = "plate", attrs = { course_kind = "timber_beam" } },
]

[[production]]
id = "normandy.framed_cell"
label = "Cell"
when = "opening_type != 'none'"
doc = "A cell with a window: the window's anatomy, then the frame around it."
do = [
  { call = "kit.split_cell_around_its_light" },
  { each = "frame_posts(x, w, settings[setting].spacing, post, child('LightBay'), is_last('Cell'))", do = [
      { insert = "Post", at = ["item", "y", "post", "h - plate"], name = "post{i}", attrs = { order = "timber" } },
  ] },
]

[[production]]
id = "normandy.frame_wall"
label = "Cell"
when = "opening_type == 'none'"
doc = "A cell with no window is all frame: posts, and a brace from the foot of the corner post up into the panel, mirrored at the two ends."
do = [
  { each = "frame_posts(x, w, settings[setting].spacing, post, None, is_last('Cell'))", do = [
      { insert = "Post", at = ["item", "y", "post", "h - plate"], name = "post{i}", attrs = { order = "timber" } },
  ] },
  { let = { bw = "min(w, 1.2)" } },
  { insert = "Brace", at = ["x if index == 0 else x + w - bw", "y", "bw", "h - plate"], name = "brace", attrs = { direction = "= 'falling' if index == 0 else 'rising'" } },
]

[[production]]
id = "normandy.light_bay"
label = "LightBay"
doc = "Under an upstairs window the breast is filled with a Saint Andrew's cross."
do = [
  { call = "kit.split_light_bay" },
  { let = { b = "child('Breast')" } },
  { insert = "Brace", at = ["b.x", "b.y", "b.w", "b.h"], name = "cross_up", attrs = { direction = "rising" }, when = "role != 'ground' and b.h > 0.3" },
  { insert = "Brace", at = ["b.x", "b.y", "b.w", "b.h"], name = "cross_down", attrs = { direction = "falling" }, when = "role != 'ground' and b.h > 0.3" },
]

[[production]]
id = "normandy.light"
label = "Light"
do = [ { call = "kit.dress_the_light" } ]

[[production]]
id = "normandy.gable"
label = "Gable"
doc = "The town gable: a loft storey in it with a window, a king post up to the ridge and a brace each side of it."
let = { lw = "w * 0.42" }
do = [
  { insert = "Storey", at = ["x + (w - lw) / 2.0", "y", "lw", "1.9"], name = "loft", attrs = { role = "loft" } },
  { insert = "Post", at = ["x + w / 2.0 - post / 2.0", "y + 1.9", "post", "h * 0.55 - 1.9 + 1.0"], name = "king_post", attrs = { order = "timber" } },
  { insert = "Brace", at = ["x + w * 0.12", "y", "w * 0.17", "1.9"], name = "brace_left", attrs = { direction = "rising" } },
  { insert = "Brace", at = ["x + w * 0.71", "y", "w * 0.17", "1.9"], name = "brace_right", attrs = { direction = "falling" } },
]

[[production]]
id = "normandy.roof"
label = "Roof"
doc = "A thatched roof carries a dormer over every other window axis of the floor below, and a brick chimney at one end."
do = [
  { each = "every_other(bay_axes('b/facade/floor0/storey'))", do = [
      { insert = "Dormer", at = ["item - 0.6", "y + 0.4", "1.2", "1.7"], name = "dormer{i}" },
  ] },
  { insert = "Chimney", at = ["w * 0.78", "y + h", "0.8", "1.2"], name = "chimney" },
]

# --- rules ---------------------------------------------------------------------

[[layer]]
name = "roles"
order = 0

[[layer]]
name = "base"
order = 0

[[rule]]
id = "normandy.roles.loft"
label = "Storey"
layer = "roles"
when = "has('role') and role == 'loft'"
set = { wall_material = "plaster_ochre" }

[[rule]]
id = "normandy.roles.floor_role"
label = "Storey"
layer = "roles"
doc = "Ground, upper or loft, and ochre torchis between the timbers."
when = "not (has('role') and role == 'loft')"
let = { i = "floor_index if has('floor_index') else 0" }
set = { role = "= 'ground' if i == 0 else 'loft' if (setting == 'country' and i == len(settings[setting].heights) - 1) else 'upper'", wall_material = "plaster_ochre" }

[[rule]]
id = "normandy.base.end_panels_are_frame"
label = "Cell"
when = "not is_bay()"
set = { opening_type = "none" }

[[rule]]
id = "normandy.base.the_knee_wall_is_blind"
label = "Cell"
doc = "A country loft's knee wall has no windows: its light comes from the dormers."
when = "role == 'loft' and setting == 'country'"
specificity = 10
set = { opening_type = "none" }

[[rule]]
id = "normandy.base.a_window_between_posts"
label = "Cell"
doc = "A bay holds a casement between two posts, under the plate."
when = "is_bay()"
let = { sill_h = "0.9 if role != 'loft' else 0.4" }
set = { opening_type = "window", head = "flat", light_width = "= min(w * 0.55, 1.0)", sill = "= sill_h", light_height = "= max(0.6, h - sill_h - 0.45 - plate)", surround_kind = "none", keystone_present = false }

[[rule]]
id = "normandy.base.the_door"
label = "Cell"
doc = "On the ground floor one bay is the door: in town the shop's, at the side; in the country the house's, in the middle."
when = "is_bay() and role == 'ground' and (is_first_bay() if setting == 'town' else is_middle_bay())"
specificity = 10
set = { opening_type = "pedestrian_entrance", head = "flat", light_width = 0.95, sill = 0.0, light_height = "= min(2.2, h - 0.4)" }

[[rule]]
id = "normandy.base.the_shop_window"
label = "Cell"
doc = "A town house's ground floor is a shop: wide openings between the posts."
when = "is_bay() and role == 'ground' and setting == 'town'"
specificity = 5
set = { opening_type = "window", light_width = "= w * 0.8", sill = 0.6, light_height = "= h - 0.6 - 0.55" }
