# The Brooklyn and Manhattan brownstone row house, as rules.
#
# A speculative row house of 1850-1890 on a lot of 16 to 25 feet: an English
# basement half a storey above the sidewalk, a high stoop over it to the
# parlour floor's door, three bays (the door's and two windows), and two or
# three bedroom floors under a cornice. The date chooses the dress:
#
# * Italianate (to c. 1870): round-headed parlour windows, segmental heads
#   above, every opening under a heavy hood on scrolled consoles, a deep
#   bracketed cornice;
# * Neo-Grec (c. 1870-1885): square heads under flat projecting lintels with
#   incised lines, an angular bracketed cornice; on a wider lot a two-storey
#   bay front;
# * Romanesque Revival (from c. 1885): rock-faced stone at the base, round
#   arches with keystones on the parlour and top floors, a modillioned
#   cornice; on a wider lot a bay front rising through the house.
#
# Numbers are INFERRED round figures from photographs: 147-159 Prospect
# Place, Prospect Heights (Italianate, round-arched parlour windows under
# console hoods, a high stoop); Park Slope's Union Street and Carroll Street
# rows; the Neo-Grec and Romanesque rows of Harlem's Mount Morris Park and
# Brooklyn Heights' Hicks and Henry Streets.

[style]
name = "brownstone"
site = ["year", "klass", "seed", "width"]
axiom = { w = "width", h = 30 }
overhangs = ["Cornice", "Hood", "Sill"]
describe = { rule = "brownstone.row_house", phase = "period", detail = "f'{kind} brownstone, {width:.1f} m, {len(storey_heights)} storeys, {year}, {klass}'" }

[lot_props]
year = "= year"

[emit]
Stoop = "brownstone.stoop"
Sill = "brownstone.hood"
Rail = "kit.column"
Picket = "kit.column"
Finial = "grow.stone"
Newel = "grow.stone"
Hood = "brownstone.hood"
Grille = "brownstone.grille"
Cell = "brownstone.cell"
Socle = "brownstone.socle"
Storey = "brownstone.storey"

[params]
# The dress by date, as overlapping odds: [last year, [italianate, neo_grec, romanesque]].
# "early" is the brick house of the 1840s-50s over a brownstone basement.
kinds = ["early", "italianate", "neo_grec", "romanesque"]
kind_ramp = [[1854, [0.6, 0.4, 0.0, 0.0]], [1866, [0.0, 1.0, 0.0, 0.0]], [1872, [0.0, 0.6, 0.4, 0.0]], [1882, [0.0, 0.1, 0.9, 0.0]], [1886, [0.0, 0.0, 0.7, 0.3]], [1889, [0.0, 0.0, 0.35, 0.65]], [9999, [0.0, 0.0, 0.15, 0.85]]]
basement_h = [2.3, 2.8]         # the parlour floor stands about eight feet up
parlour_h = [3.8, 4.2]          # the tallest room in the house
upper_h = [3.1, 3.5]            # the first bedroom floor; each over it a little lower
upper_taper = 0.95
# One stone for the whole front (hoods, sills, stoop and newels in it, a
# shade lighter), and a dark cornice (grading fix 1).
stones = { brownstone_choc = 3, brownstone = 4, brownstone_red = 2, brownstone_rosy = 1 }
cornice_paints = { cornice_black_brown = 5, cornice_dark_brown = 3, cornice_dark_green = 2 }
window_ws = [1.05, 1.25]
bedroom_heads = { flat = 3, segmental = 2 }                   # an Italianate bedroom window
italianate_doors = { door_pediment = 7, door_scrolls = 3 }    # consoles under a pediment, or scrolled consoles
bay_odds = 0.45                 # of fronts wide enough, a bay front
neo_grec_full_bay = 0.5         # a Neo-Grec bay through the house, else two storeys
uppers = { modest = [1, 2], ordinary = [2, 2], comfortable = [2, 3], grand = [3, 3] }
stoop_ws = [1.7, 2.1]
# The builder's choices within a dress.
italianate_hoods = { bracketed = 3, lintel = 1 }         # console hoods, or a flat cornice slab
parlour_heads = { flat = 2, round = 2, segmental = 1 }   # an Italianate parlour window
brick_uppers = { early = 1.0, italianate = 0.15, neo_grec = 0.2, romanesque = 0.5 }   # brick over a brownstone base
cornice_hs = [0.75, 1.0]
# The stoop's balustrade (seen edge on): brownstone on an Italianate stoop,
# cast iron on most later ones; and the iron fence round the areaway.
p_iron_stoop = { early = 0.6, italianate = 0.85, neo_grec = 0.7, romanesque = 0.3 }
areaway_fence = 0.85
picket_pitch = 0.13
entry_share = 0.36              # the door's bay of the three
bay_front_min = 5.8             # a lot narrower than about 19 ft has a flat front
side_share = 0.18               # an angled face of a bay front, seen from the street
door_w = 1.35                   # a pair of doors

# --- productions -------------------------------------------------------------

[[production]]
id = "brownstone.lot"
label = "Lot"
doc = "The date chooses the dress; the class, the floors; the builder (the seed), which side the door is on. A late front wide enough swells into a bay. The stoop climbs over the basement to the door."
do = [
  { set = { kind = "= draw('kind', kinds, step(kind_ramp, year))", entry_left = "= chance('entry_left', 0.5)" } },
  { set = { base_h = "= between('basement_h', basement_h[0], basement_h[1])", hood_kind = "= draw('hood', italianate_hoods)", parlour_head = "= draw('parlour_head', parlour_heads)", brick_up = "= chance('brick_up', brick_uppers[kind])", iron_stoop = "= chance('iron_stoop', p_iron_stoop[kind])", stone = "= draw('stone', stones)", cornice_paint = "= draw('cornice_paint', cornice_paints)", window_w = "= between('window_w', window_ws[0], window_ws[1])", bedroom_head = "= draw('bedroom_head', bedroom_heads)", door_frame = "= draw('door_frame', italianate_doors)", fenced = "= chance('areaway', areaway_fence)", cornice_depth = "= between('cornice_h', cornice_hs[0], cornice_hs[1]) * (0.75 if kind == 'romanesque' else 0.6 if kind == 'early' else 1.0)", sw = "= min(between('stoop_w', stoop_ws[0], stoop_ws[1]), w * entry_share - 0.1)" } },
  { let = { n_up = "draw('uppers', range(uppers[klass][0], uppers[klass][1] + 1))" } },
  { set = { storey_heights = "= [base_h, between('parlour_h', parlour_h[0], parlour_h[1])] + geometric(between('upper_h', upper_h[0], upper_h[1]), upper_taper, n_up)", bay_front = "= kind in ('neo_grec', 'romanesque') and w >= bay_front_min and chance('bay', bay_odds)" } },
  { set = { trim_paint = "= 'trim_' + stone" } },
  # The bay rises two storeys on a Neo-Grec front, through the house on a
  # Romanesque one.
  { set = { bay_top = "= 2 if (kind == 'neo_grec' and not chance('full_bay', neo_grec_full_bay)) else len(storey_heights) - 1" } },
  { let = { front = "fsum(storey_heights)", ew = "w * entry_share" } },
  { insert = "Facade", at = ["0.0", "0.0", "w", "front"], name = "facade" },
  { let = { sx = "(ew / 2.0 if entry_left else w - ew / 2.0) - sw / 2.0" } },
  { insert = "Stoop", at = ["sx", "0.0", "sw", "base_h"], name = "stoop", attrs = { stone_paint = "stoop_brownstone" } },
  # The stoop's balustrades, seen edge on, and its newels at the foot.
  { insert = "StoopRail", at = ["max(0.0, sx - 0.3)", "0.0", "min(w, sx + sw + 0.3) - max(0.0, sx - 0.3)", "base_h + 1.0"], name = "stoop_rail" },
  # The areaway's iron fence, along the front beside the stoop.
  { insert = "Areaway", at = ["(sx + sw + 0.32) if entry_left else 0.05", "0.0", "(w - 0.05 - sx - sw - 0.32) if entry_left else (sx - 0.37)", "1.25"], name = "areaway", when = "fenced" },
]

[[production]]
id = "brownstone.facade"
label = "Facade"
doc = "Basement, parlour, the bedroom floors."
do = [ { split = "y", id_base = "parent", parts = [ { repeat = "storey_heights", label = "Storey", size = "item", name = "s{i}" } ] } ]

[[production]]
id = "brownstone.storey"
label = "Storey"
doc = "Every floor is cut into the door's bay and the windows' zone. A water table caps the basement; a Romanesque base is rock-faced; the cornice crowns the top floor."
let = { ew = "w * entry_share" }
do = [
  { split = "x", when = "entry_left", parts = [ { label = "EntryZone", size = "ew", name = "entry" }, { label = "WindowZone", size = "w - ew", name = "windows" } ] },
  { split = "x", when = "not entry_left", parts = [ { label = "WindowZone", size = "w - ew", name = "windows" }, { label = "EntryZone", size = "ew", name = "entry" } ] },
  { insert = "Socle", at = ["x", "y", "w", "h"], name = "rockface", when = "kind == 'romanesque' and role in ('basement', 'parlour')" },
  { insert = "Entablature", at = ["x", "y + h - 0.25", "w", "0.25"], name = "water_table", attrs = { course_kind = "bandeau", paint = "= trim_paint" }, when = "role == 'basement'" },
  { insert = "Cornice", at = ["x", "y + h", "w", "cornice_depth"], name = "cornice", attrs = { cornice_ornament = "= 'modillioned' if kind in ('romanesque', 'early') else 'bracketed'", paint = "= cornice_paint" }, when = "index == count - 1" },
]

[[production]]
id = "brownstone.window_zone"
label = "WindowZone"
doc = "Two windows between piers; or, on a late wide front, a bay of three faces, an angled one either side of the front, a pilaster at every arris."
let = { bayed = "bay_front and level < bay_top", side = "w * side_share" }
do = [
  { split = "x", when = "not bayed", parts = [
      { label = "Cell", size = "0.3", name = "x0", slot = "end" },
      { label = "Cell", size = "(w - 0.6 - w * 0.17) / 2.0", name = "x1", slot = "bay" },
      { label = "Cell", size = "w * 0.17", name = "x2", slot = "end" },
      { label = "Cell", size = "(w - 0.6 - w * 0.17) / 2.0", name = "x3", slot = "bay" },
      { label = "Cell", size = "0.3", name = "x4", slot = "end" },
  ] },
  { split = "x", when = "bayed", parts = [
      { label = "Cell", size = "side", name = "x0", slot = "bay", attrs = { face = "side" } },
      { label = "Cell", size = "w - 2 * side", name = "x1", slot = "bay", attrs = { face = "front" } },
      { label = "Cell", size = "side", name = "x2", slot = "bay", attrs = { face = "side" } },
  ] },
  { each = "[x, x + side, x + w - side, x + w]", when = "bayed", do = [
      { insert = "Column", at = ["min(max(item - 0.11, x), x + w - 0.22)", "y", "0.22", "h"], name = "arris{i}", attrs = { order = "pilaster", paint = "= trim_paint" } },
  ] },
]

[[production]]
id = "brownstone.entry_zone"
label = "EntryZone"
doc = "The door's bay: the door on the parlour floor at the head of the stoop, a window over it on every floor above."
do = [ { split = "x", parts = [
    { label = "Cell", size = "0.3", name = "x0", slot = "end" },
    { label = "Cell", size = "w - 0.6", name = "x1", slot = "bay" },
    { label = "Cell", size = "0.3", name = "x2", slot = "end" },
] } ]

[[production]]
id = "brownstone.stoop_rail"
label = "StoopRail"
doc = "The stoop's two balustrades seen edge on, grown: a brownstone wall with a newel block at its foot, or cast iron -- a newel post with an urn and the rail's edge rising to the door."
do = [ { grow = "brownstone.stoop_rail", generations = 1, params = { iron = "iron_stoop", climb = "base_h + 0.95" } } ]

[[production]]
id = "brownstone.areaway"
label = "Areaway"
doc = "The areaway's iron fence, grown: a top and a bottom rail, pickets at a steady pitch each with a spear head, a post with a finial at each end."
do = [ { grow = "brownstone.areaway", generations = 2, params = { n = "max(4, round(w / picket_pitch))" } } ]

[[production]]
id = "brownstone.cell"
label = "Cell"
when = "opening_type != 'none'"
do = [ { call = "kit.split_cell_around_its_light" } ]

[[production]]
id = "brownstone.light_bay"
label = "LightBay"
do = [ { call = "kit.split_light_bay" } ]

[[production]]
id = "brownstone.light"
label = "Light"
doc = "The light, its keystone and frame; an iron grille over a basement window; over an Italianate opening a hood on consoles, over a Neo-Grec one an incised lintel."
do = [
  { call = "kit.dress_the_light" },
  { insert = "Grille", at = ["x", "y", "w", "h"], name = "grille", when = "has('grille') and grille" },
  { insert = "Hood", at = ["x - 0.1", "y + h", "w + 0.2", "0.32 if hood == 'bracketed' else 0.26"], name = "hood", attrs = { hood_kind = "= hood" }, when = "hood != 'none'" },
  { insert = "Sill", at = ["x - 0.1", "y - 0.12", "w + 0.2", "0.12"], name = "sill", attrs = { hood_kind = "sill" }, when = "has('hood') and opening_type == 'window' and role != 'basement' and not (kind == 'romanesque' and role == 'parlour')" },
]

# --- rules ---------------------------------------------------------------------
# (A top-floor window stops 0.45 m shorter: the main cornice's frieze and
# brackets hang into the storey over it.)

[[layer]]
name = "roles"
order = 0

[[layer]]
name = "base"
order = 0

[[rule]]
id = "brownstone.roles.floor_and_stone"
label = "Storey"
layer = "roles"
doc = "Basement, parlour, bedroom floors. Brownstone throughout, except that some builders -- most Romanesque ones -- raise brick bedroom floors on a brownstone base."
let = { up = "index >= (2 if kind == 'romanesque' else 1)" }
set = { role = "= ['basement', 'parlour'][index] if index < 2 else 'chamber'", level = "= index", wall_material = "= ('brick_romanesque' if kind == 'romanesque' else 'brick') if (brick_up and up) else stone", trim_paint = "= trim_paint" }

[[rule]]
id = "brownstone.base.wall"
label = "Cell"
when = "not is_bay()"
set = { opening_type = "none" }

[[rule]]
id = "brownstone.base.basement_window"
label = "Cell"
doc = "The basement's windows sit low behind iron grilles."
when = "is_bay() and role == 'basement'"
set = { opening_type = "window", head = "flat", light_width = "= min(window_w, w - 0.3)", sill = 0.45, light_height = 1.25, surround_kind = "none", keystone_present = false, grille = true, hood = "none" }

[[rule]]
id = "brownstone.base.under_the_stoop"
label = "Cell"
doc = "Under the stoop the basement door is hidden; the bay shows no opening."
when = "is_bay() and role == 'basement' and in_parent('EntryZone')"
specificity = 10
set = { opening_type = "none" }

[[rule]]
id = "brownstone.base.a_window"
label = "Cell"
doc = "Parlour windows reach nearly to the floor, round-headed on an Italianate or Romanesque front; bedroom windows are shorter, segmental in the Italianate, square in the Neo-Grec, square in the Romanesque but arched on its top floor. The Italianate hoods every opening on consoles, the Neo-Grec gives it an incised lintel, the Romanesque a keystone."
when = "is_bay() and role != 'basement'"
let = { parlour = "role == 'parlour'", top = "level == len(storey_heights) - 1", front = "has('face') and face == 'front'", side = "has('face') and face == 'side'" }
set = { opening_type = "window", head = "= (parlour_head if parlour else ('segmental' if (top and chance('top_head', 0.6)) else bedroom_head)) if kind == 'italianate' else (('round' if (parlour or top) else 'flat') if kind == 'romanesque' else 'flat')", light_width = "= min(1.9, w - 0.5) if front else ((w - 0.22) if side else min(window_w, w - 0.3))", sill = "= 0.55 if parlour else 0.75", light_height = "= h - (0.55 + 0.95 if parlour else 0.75 + 0.55) - (0.25 if top else 0.0)", surround_kind = "= 'none' if kind in ('neo_grec', 'early') else 'moulded_architrave'", keystone_present = "= kind == 'romanesque' and (parlour or top)", grille = false, hood = "= hood_kind if kind == 'italianate' else ('lintel' if kind in ('neo_grec', 'early') else 'none')" }

[[rule]]
id = "brownstone.base.the_door"
label = "Cell"
doc = "At the head of the stoop the parlour floor's entry bay is the front door, its head about level with the parlour windows', in an enframement by the dress: consoles under a pediment or scrolled consoles (Italianate), angular consoles (Neo-Grec), flat pilasters (the early brick house), a moulded arch (Romanesque)."
when = "is_bay() and role == 'parlour' and in_parent('EntryZone')"
specificity = 10
set = { opening_type = "pedestrian_entrance", head = "= 'flat' if kind in ('neo_grec', 'early') else 'round'", light_width = "= min(door_w, w - 0.2)", sill = 0.0, light_height = "= h - 0.9", surround_kind = "= door_frame if kind == 'italianate' else 'door_scrolls' if kind == 'neo_grec' else 'door_pilasters' if kind == 'early' else 'moulded_architrave'", keystone_present = "= kind == 'romanesque'", grille = false }

# --- the grown ironwork -----------------------------------------------------------

[[lsystem]]
id = "brownstone.stoop_rail"
doc = "A stoop's balustrades edge on: on each side a brownstone wall to the door's height with a newel block at its foot, or an iron rail's edge over a cast-iron newel and urn."
axiom = "Stoop"
rules = [
  { id = "brownstone.stoop_rail.stone", pred = "Stoop", when = "not iron", to = "StoneSide(0) StoneSide(1)" },
  { id = "brownstone.stoop_rail.iron", pred = "Stoop", when = "iron", to = "IronSide(0) IronSide(1)" },
]
interpret = [
  { module = "StoneSide(k)", do = [
      { polygon = "Newel", points = "[[(0.0 if k == 0 else cw - 0.42), 0.0], [(0.42 if k == 0 else cw), 0.0], [(0.42 if k == 0 else cw), 1.15], [(0.0 if k == 0 else cw - 0.42), 1.15]]", attrs = { paint = "= 'wall_' + stone", edge = "cornice_stroke" } },
      { polygon = "Newel", points = "[[(0.05 if k == 0 else cw - 0.37), 1.15], [(0.37 if k == 0 else cw - 0.05), 1.15], [(0.37 if k == 0 else cw - 0.05), climb], [(0.05 if k == 0 else cw - 0.37), climb]]", attrs = { paint = "= 'wall_' + stone", edge = "cornice_stroke" } },
      { polygon = "Newel", points = "[[(0.0 if k == 0 else cw - 0.42), 1.15], [(0.42 if k == 0 else cw), 1.15], [(0.42 if k == 0 else cw), 1.27], [(0.0 if k == 0 else cw - 0.42), 1.27]]", attrs = { paint = "= 'wall_' + stone", edge = "cornice_stroke" } },
  ] },
  { module = "IronSide(k)", do = [
      { place = "Rail", at = ["(0.2 if k == 0 else cw - 0.24)", "1.0", "0.04", "climb - 1.0"], attrs = { order = "iron" } },
      { place = "Rail", at = ["(0.07 if k == 0 else cw - 0.37)", "0.0", "0.3", "1.15"], attrs = { order = "iron" } },
      { polygon = "Finial", points = "[[(0.11 if k == 0 else cw - 0.33), 1.15], [(0.33 if k == 0 else cw - 0.11), 1.15], [(0.38 if k == 0 else cw - 0.06), 1.28], [(0.3 if k == 0 else cw - 0.14), 1.4], [(0.22 if k == 0 else cw - 0.22), 1.46], [(0.14 if k == 0 else cw - 0.3), 1.4], [(0.06 if k == 0 else cw - 0.38), 1.28]]", attrs = { paint = "iron" } },
  ] },
]

[[lsystem]]
id = "brownstone.areaway"
doc = "An areaway fence: rails, pickets each with a spear head, and an end post with a finial either side."
axiom = "Fence"
rules = [ { id = "brownstone.areaway.pickets", pred = "Fence", to = "Curb Sy [ ] [ Posts Rails Inset [ Rx(n) [ Picket ] ] ]" } ]
interpret = [
  { module = "Curb", polygon = "Newel", points = "[[0.0, 0.0], [cw, 0.0], [cw, 0.2], [0.0, 0.2]]", attrs = { paint = "= 'wall_' + stone", edge = "cornice_stroke" } },
  { module = "Sy", split = "y", weights = "[0.2, ch - 0.2]" },
  { module = "Posts", do = [
      { place = "Rail", at = ["0", "0", "0.08", "ch - 0.15"], attrs = { order = "iron" } },
      { place = "Rail", at = ["cw - 0.08", "0", "0.08", "ch - 0.15"], attrs = { order = "iron" } },
      { polygon = "Finial", points = "[[0.0, ch - 0.15], [0.08, ch - 0.15], [0.06, ch - 0.06], [0.04, ch], [0.02, ch - 0.06]]", attrs = { paint = "iron" } },
      { polygon = "Finial", points = "[[cw - 0.08, ch - 0.15], [cw, ch - 0.15], [cw - 0.02, ch - 0.06], [cw - 0.04, ch], [cw - 0.06, ch - 0.06]]", attrs = { paint = "iron" } },
  ] },
  { module = "Rails", do = [
      { place = "Rail", at = ["0", "0.12", "cw", "0.03"], attrs = { order = "iron" } },
      { place = "Rail", at = ["0", "ch - 0.3", "cw", "0.03"], attrs = { order = "iron" } },
  ] },
  { module = "Inset", inset = "[0.08, 0, 0.08, 0]" },
  { module = "Rx(k)", repeat = "x", n = "k" },
  { module = "Picket", do = [
      { place = "Picket", at = ["cw / 2 - 0.009", "0.0", "0.018", "ch - 0.2"], attrs = { order = "iron" } },
      { polygon = "Finial", points = "[[cw / 2 - 0.025, ch - 0.2], [cw / 2 + 0.025, ch - 0.2], [cw / 2, ch - 0.1]]", attrs = { paint = "iron" } },
  ] },
]
