# The Venetian Gothic palazzo, as rules.
#
# Tripartite: every storey is cut wing | centre | wing. The centre is the end
# of the portego, opening on the nobile floors through a polifora of ogee
# lights on colonnettes, set in a rectangular Istrian frame, and on the water
# storey through the gate. Numbers are INFERRED round figures from
# photographs (Ca' Foscari, Palazzo Bernardo, Loredan dell'Ambasciatore,
# Pisani-Moretta, Contarini Fasan) and checked against two independent
# surveys of about thirty fronts (dev/fidelity/venice/):
#
# * the water storey is as tall as a piano nobile, and where there is a
#   mezzanine it is a tier of small windows in the WINGS only, inside the
#   water storey; the centre is the double-height androne the gate opens;
# * the two nobile floors are about equal, and their polifore have the same
#   number of lights: slender (about 1 m wide, 2.5-3 times as tall), as
#   many as fill the centre, four to eight, capped by class;
# * above the second nobile floor there is nothing in about 40 % of fronts, a
#   low attic in about a third, a full third floor with its own polifora in
#   the rest (and only on a house that can afford it);
# * a water gate is 2 to 3 m wide whatever the palazzo's width. A front with
#   two gates (about one wide front in four) has them side by side under the
#   polifora, on the centre axis (Pisani-Moretta), never out in the wings; a
#   gate's head is pointed or (from about 1370) ogee, round only on the early
#   fronts before about 1350;
# * balconies are stone, a balustrade of colonnettes on corbels; wing
#   balconettes on about half the fronts; iron only as a later alteration.
#
# A family's choices (its seed) are drawn from these frequencies with a hash
# of the seed per choice (``(seed * k + c) % 100``, k prime to 100, so any
# hundred consecutive seeds give the stated shares exactly).
#
# Before 1300 the palazzo is the older Veneto-Byzantine "casa-fondaco"
# (12th-13th c.; Fondaco dei Turchi, Ca' Farsetti, Ca' Loredan, Ca' da Mosto):
# a water portico of round stilted arches on columns and a loggia of about
# 1.5-1.8 times as many narrower arches above it behind solid marble slabs
# (plutei) or open, never balusters (a Renaissance form),
# both grouped as Ruskin found them, "divided, in each case, into a centre and
# wings": an odd centre arcade, graded (the middle arch widest), and on each
# side one or two closed or windowed arches beyond a wider pier. Paterae in
# the spandrels and a band of paterae and formelle between the floors. Only
# the grand fondaco type (the Fondaco dei Turchi) has the two corner towers
# (torreselle) a storey higher and the crenellation, both as restored in 1869.

[style]
name = "venice"
site = ["width", "year", "klass", "seed"]
axiom = { w = "width", h = 40 }
overhangs = ["Cornice", "Roof"]
# (the Byzantine type's crenellation and tower edges stand inside their parts)
describe = { rule = "venice.palazzo", phase = "structure", detail = "f'Veneto-Byzantine palazzo, {width:.1f} m on the canal, {year}, {klass}' if year < byzantine_until else f'Gothic palazzo, {width:.1f} m on the canal, {year}, {klass}'" }

[lot_props]
year = "= year"
# The front stands in the canal: water at its foot, not a street.
ground = "canal"

[emit]
Merlons = "venice.crenellation"
Light = "venice.light"
Colonnette = "venice.colonnette"
Surround = "venice.surround"
Balconette = "venice.balconette"
Tracery = "venice.tracery"
Entablature = "venice.course"
Frieze = "venice.frieze"
BaseCourse = "venice.base_course"
Cell = "venice.cell"
Chimney = "venice.fumaiolo"
Roof = "venice.roof"
Column = "venice.column"

[params]
# Storey heights by class: the richer the owner, the taller the floors. The
# water storey is as tall as the first piano nobile (Pisani-Moretta), the
# second nobile floor about equal to the first.
water_h = { modest = 4.6, ordinary = 4.8, comfortable = 5.4, grand = 5.8 }
nobile1_h = { modest = 4.6, ordinary = 4.8, comfortable = 5.4, grand = 6.0 }
nobile2_h = { modest = 4.4, ordinary = 4.6, comfortable = 5.2, grand = 5.8 }
third_share = 0.85              # a third floor, of the first nobile floor (Foscari, Bernardo)
attic_h = 2.9                   # or a low mezzanine under the roof
mezz_band = 2.3                 # the wings' mezzanine tier, at the top of the water storey
gate_w = [2.0, 3.0]             # a water gate, narrowest and widest
gate_round_until = 1350         # a round-headed gate only on the earliest Gothic fronts
ogee_from = 1370                # the ogee head, nobile lights and gates alike
centre_share = 0.36             # the polifora bay's share of the front (measured 33-39 %)
centre_min = 5.5                # ...but never narrower than a portego end needs
centre_max = 9.5                # ...nor wider: a wider front gets wider wings
narrow_below = 10.0             # a front this narrow has one wing, not two
wing_bay_max = 2.8              # a wing bay, at most: wider wings take more windows
wing_end = 0.6                  # the pier at either end of a wing, at least
wing_light = 1.1                # a wing window, clear
polifora_div = 0.28             # a colonnette's shaft
polifora_cap = { modest = 4, ordinary = 5, comfortable = 6, grand = 6 }
polifora_light_max = 1.1        # a polifora light is about a metre wide, never broad (Foscari, Bernardo)
light_min_slender = 2.6         # ...and at least this many widths tall (h:w 2.5-3 measured)
light_slenderness = 3.2         # a light no taller than this many widths (h:w 2.5-3.5)
frame_head = 0.35               # the frame's room over an arch's tip
tracery_h = 0.62                # the tracery's rise over the arch tips: its quatrefoils stand between them
cornice_h = 0.6
# --- what the families did differently ---------------------------------------
# The roof: low (about 18 degrees), hipped, standing back from the front behind
# the cornice, so that from the canal at most a sliver shows over it; on about
# a third of the fronts nothing shows at all.
roof_pitch = 18.0
roof_back = 1.2                 # how far the eaves stand back behind the front
roof_heights = [0.5, 0.7, 0.9]  # the sliver's height, by family
roof_hidden_share = 30
# The chimneys: one, two or three funnels, where the flues happen to rise.
chimney_sets = [[0.08, 0.92], [0.15], [0.12, 0.5, 0.88], [0.26, 0.8], [0.86], [0.1, 0.68]]
chimney_heights = [3.0, 2.6, 3.3, 2.8]
# The eaves cornice: a corbelled stone cornice, or a plain dentilled one; its depth.
cornice_depths = [0.6, 0.55, 0.7]
dentil_cornice_share = 35
# The Istrian base course along the water: its height, by family.
plinth_heights = [0.75, 0.6, 0.95, 1.2]
tide_band = 0.22                # the wet, weed-dark foot of the base course
# The corners: a dentilled Istrian strip, or quoins of long and short blocks.
quoin_share = 40
# Glazing: bottle-glass roundels (rui) in about a third of the houses; and,
# in every house, a few wing windows with their wooden shutters (scuri) shut.
rondel_share = 35

# --- the Veneto-Byzantine type (before 1300) ------------------------------------
byzantine_until = 1300          # the Gothic type replaces it in the 14th century
portico_h = { modest = 4.6, ordinary = 5.0, comfortable = 5.6, grand = 6.2 }
loggia_h = { modest = 4.4, ordinary = 4.6, comfortable = 5.0, grand = 5.4 }
tower_top_h = 3.8               # the torresella's storey above the cornice, as restored in 1869
torresella_share = 0.17         # each corner tower, of the front (Fondaco: a sixth)
fondaco_from = 20.0             # only a grand fondaco this wide has torreselle and merlons
portico_arch = 2.6              # a portico arch with its column, INFERRED (Fondaco, Loredan)
arcade_end = 0.55               # the pier closing an arcade at each end
wing_pier = 0.75                # the wider pier between the centre and a wing
merlon_h = 2.4                  # the Fondaco's crenellation, at Ruskin's scale
riva_h = 0.45                   # the stone riva the portico's columns stand on, over the water
pluteus_share = 75              # loggias closed by marble slabs (plutei); the rest open

# === The Gothic palazzo (from 1300) ===============================================

[[production]]
id = "venice.lot"
label = "Lot"
when = "year >= byzantine_until"
doc = "The palazzo stands its whole front on the canal. The family (the seed) settles what the frequencies leave open: what stands over the second nobile floor, a mezzanine in the wings, two gates on a wide front (side by side under the polifora), balconettes, the wall. A gate's head is the family's too, within its date: round only before 1350, ogee only from 1370."
do = [
  { let = { u_roof = "(seed * 7 + 3) % 100", u_cor = "(seed * 89 + 41) % 100", u_q = "(seed * 31 + 7) % 100", u_glz = "(seed * 23 + 9) % 100", fj = "((seed * 29 + 13) % 7 - 3) * 0.08" } },
  { set = { roof_show = "= u_roof >= roof_hidden_share", chims = "= chimney_sets[(seed * 11) % 6] if width >= 12 else [chimney_sets[(seed * 11) % 6][0]]", chim_h = "= chimney_heights[(seed * 3) % 4]", roof_h = "= roof_heights[(seed * 5 + 1) % 3]", cornice_kind = "= 'dentil_eave' if u_cor < dentil_cornice_share else 'corbelled_eave'", cornice_d = "= cornice_depths[(seed * 7) % 3]", base_h = "= plinth_heights[(seed * 3) % 4]", corner_kind = "= 'quoins' if u_q < quoin_share else 'dentil_strip'", glaze = "= 'rondel' if u_glz < rondel_share else ''" } },
  { let = { rich = "klass in ('comfortable', 'grand')", u_top = "(seed * 37 + 11) % 100", u_mezz = "(seed * 53 + 5) % 100", u_gates = "(seed * 71 + 3) % 100", u_wall = "(seed * 17 + 23) % 100", u_pbal = "(seed * 61 + 19) % 100", u_gh = "(seed * 91 + 29) % 100", u_wh = "(seed * 43 + 31) % 100", u_tr = "(seed * 67 + 2) % 100", u_iron = "(seed * 59 + 37) % 100" } },
  { let = { two = "width >= 20 and u_gates < 25" } },
  { set = { gate_pair = "= two", mezz = "= width >= 14 and u_mezz < 50", top = "= 'none' if u_top < 40 else ('third' if rich and u_top >= 75 else 'attic')", wing_balconies = "= (seed * 83 + 13) % 100 < 55", wing_iron = "= u_iron < 20", pn2_balcony = "= u_pbal < 70", nobile_head = "= 'pointed' if year < ogee_from else 'ogee'", gate_head = "= ('round' if year < gate_round_until else ('ogee' if year >= ogee_from else 'pointed')) if u_gh >= 75 else ('pointed' if u_gh < 45 or year < ogee_from else 'ogee')", water_head = "= 'round' if u_wh < 45 else ('pointed' if u_wh < 75 else 'flat')", tracery_on = "= [] if not (rich and year >= 1420) else (['nobile1', 'nobile2'] if klass == 'grand' and u_tr < 35 else (['nobile2'] if u_tr < 70 else ['nobile1']))", palazzo_wall = "= 'brick' if u_wall < 40 else ('stucco_rose' if u_wall < 70 else ('stucco' if u_wall < 90 else 'plaster_ochre'))" } },
  { set = { floors = "= [['water', water_h[klass] + fj], ['nobile1', nobile1_h[klass] + fj], ['nobile2', nobile2_h[klass] + fj]] + ([['third', third_share * nobile1_h[klass]]] if top == 'third' else ([['attic', attic_h]] if top == 'attic' else []))" } },
  { let = { front = "fsum(column(floors, 1))" } },
  { insert = "Facade", at = ["0.0", "0.0", "w", "front"], name = "facade" },
  # The roof stands back behind the cornice: a sliver of it over the corona, or nothing.
  { insert = "Roof", at = ["roof_back", "front + cornice_d * 0.7", "w - 2 * roof_back", "roof_h"], name = "roof", attrs = { pitch = "= roof_pitch" }, when = "roof_show" },
  { insert = "Chimney", at = ["w * chims[0] - 0.275", "front + cornice_d * 0.6", "0.55", "chim_h"], name = "fumaiolo_left" },
  { insert = "Chimney", at = ["w * chims[1] - 0.275", "front + cornice_d * 0.6", "0.55", "chim_h * 0.9"], name = "fumaiolo_right", when = "len(chims) > 1" },
  { insert = "Chimney", at = ["w * chims[2] - 0.275", "front + cornice_d * 0.6", "0.55", "chim_h * 0.95"], name = "fumaiolo_third", when = "len(chims) > 2" },
]

[[production]]
id = "venice.facade"
label = "Facade"
doc = "The water storey, two nobile floors, and perhaps a third floor or a low attic; an Istrian stone strip with dentilled edge at each corner, from the water to the cornice."
do = [
  { split = "y", id_base = "parent", parts = [ { repeat = "floors", label = "Storey", size = "item[1]", name = "s{i}", attrs = { floor = "= item[0]" } } ] },
  { insert = "Column", at = ["x", "y", "0.5 if corner_kind == 'quoins' else 0.32", "h"], name = "corner_left", attrs = { order = "= corner_kind", side = "left" } },
  { insert = "Column", at = ["x + w - (0.5 if corner_kind == 'quoins' else 0.32)", "y", "0.5 if corner_kind == 'quoins' else 0.32", "h"], name = "corner_right", attrs = { order = "= corner_kind", side = "right" } },
]

[[production]]
id = "venice.storey"
label = "Storey"
when = "in_parent('Facade')"
doc = "Every storey is cut the same way: wing, centre, wing (on a front under 10 m, centre and one wing); the centre (the portego's end) about a third of the front, within bounds. A dentilled course crowns each storey; the top carries a deep corbelled cornice; the water storey stands on an Istrian base course."
let = { centre = "min(centre_max, max(centre_share * w, min(centre_min, 0.42 * w)))" }
do = [
  { split = "x", when = "w >= narrow_below", parts = [
      { label = "Wing", size = "(w - centre) / 2.0", name = "wing_left", attrs = { side = "left" } },
      { label = "Centre", size = "centre", name = "centre" },
      { label = "Wing", size = "(w - centre) / 2.0", name = "wing_right", attrs = { side = "right" } },
  ] },
  # A palazzetto too narrow for two wings is bipartite: the polifora to one
  # side, one wing beside it (Contarini Fasan's kind), the side the family's.
  { split = "x", when = "w < narrow_below and seed % 2 == 0", parts = [
      { label = "Centre", size = "w * 0.55", name = "centre" },
      { label = "Wing", size = "w * 0.45", name = "wing_right", attrs = { side = "right" } },
  ] },
  { split = "x", when = "w < narrow_below and seed % 2 == 1", parts = [
      { label = "Wing", size = "w * 0.45", name = "wing_left", attrs = { side = "left" } },
      { label = "Centre", size = "w * 0.55", name = "centre" },
  ] },
  { insert = "Cornice", at = ["x", "y + h", "w", "cornice_d"], name = "cornice", attrs = { cornice_ornament = "= cornice_kind" }, when = "index == count - 1" },
  { insert = "Entablature", at = ["x", "y + h - 0.18", "w", "0.18"], name = "string_course", attrs = { course_kind = "dentil" }, when = "index != count - 1" },
  { insert = "BaseCourse", at = ["x", "y", "w", "base_h"], name = "base_course", attrs = { rows = "= 2 if base_h < 0.9 else 3" }, when = "role == 'water'" },
]

[[production]]
id = "venice.wing"
label = "Wing"
when = "not (role == 'water' and mezz)"
doc = "A wing is wall with single windows in it: one on a narrow wing, two a side on most fronts (14-22 m), three or four on the widest; the windows spaced evenly between an end pier at the corner and one beside the centre."
let = { nb = "1 if w < 4.0 else (2 if w < 7.5 else max(3, round((w - 2 * wing_end) / wing_bay_max)))" }
do = [
  { let = { bay = "min(wing_bay_max, (w - 2 * wing_end) / nb)" } },
  { split = "x", parts = [
      { label = "Cell", size = "(w - nb * bay) / 2.0", name = "x{n}", slot = "end" },
      { repeat = "range(nb)", label = "Cell", size = "bay", name = "x{n}", slot = "bay" },
      { label = "Cell", size = "(w - nb * bay) / 2.0", name = "x{n}", slot = "end" },
  ] },
]

[[production]]
id = "venice.wing_with_mezzanine"
label = "Wing"
when = "role == 'water' and mezz"
doc = "Where the house has a mezzanine it is in the wings, a tier of small windows at the top of the water storey, on the same axes as the windows below and above."
do = [
  { split = "y", parts = [
      { label = "WingTier", size = "h - mezz_band", name = "low", attrs = { tier = "low" } },
      { label = "WingTier", size = "mezz_band", name = "mezz", attrs = { tier = "mezz" } },
  ] },
]

[[production]]
id = "venice.wing_tier"
label = "WingTier"
let = { nb = "1 if w < 4.0 else (2 if w < 7.5 else max(3, round((w - 2 * wing_end) / wing_bay_max)))" }
do = [
  { let = { bay = "min(wing_bay_max, (w - 2 * wing_end) / nb)" } },
  { split = "x", parts = [
      { label = "Cell", size = "(w - nb * bay) / 2.0", name = "x{n}", slot = "end" },
      { repeat = "range(nb)", label = "Cell", size = "bay", name = "x{n}", slot = "bay" },
      { label = "Cell", size = "(w - nb * bay) / 2.0", name = "x{n}", slot = "end" },
  ] },
]

[[production]]
id = "venice.centre"
label = "Centre"
doc = "The centre is the portego's end: on the nobile and third floors one wide cell for the polifora, under an attic a row of small windows on the polifora's axes, on the water storey the gate (between two lights where there is room for them), or two gates side by side."
do = [
  { split = "x", when = "role in ('nobile', 'third', 'attic')", parts = [
      { label = "Cell", size = "0.45", name = "x0", slot = "end" },
      { label = "Cell", size = "w - 2 * 0.45", name = "x1", slot = "bay" },
      { label = "Cell", size = "0.45", name = "x2", slot = "end" },
  ] },
  # A water gate is as wide as a boat and its mooring need, 2 to 3 m, not a
  # share of the front. Lights flank it where the centre has room for them;
  # on a narrow palazzo the gate stands alone in the centre's wall.
  { let = { gate = "min(gate_w[1], max(gate_w[0], w * 0.42))" } },
  { let = { flanked = "w - 1.2 - gate >= 2 * 1.4", single = "role == 'water' and not gate_pair" } },
  { split = "x", when = "single and flanked", parts = [
      { label = "Cell", size = "0.4", name = "x0", slot = "end" },
      { label = "Cell", size = "(w - 1.2 - gate) / 2.0", name = "x1", slot = "bay" },
      { label = "Cell", size = "gate + 0.4", name = "x2", slot = "bay" },
      { label = "Cell", size = "(w - 1.2 - gate) / 2.0", name = "x3", slot = "bay" },
      { label = "Cell", size = "0.4", name = "x4", slot = "end" },
  ] },
  { split = "x", when = "single and not flanked", parts = [
      { label = "Cell", size = "(w - gate - 0.4) / 2.0", name = "x0", slot = "end" },
      { label = "Cell", size = "gate + 0.4", name = "x1", slot = "bay" },
      { label = "Cell", size = "(w - gate - 0.4) / 2.0", name = "x2", slot = "end" },
  ] },
  # Two gates side by side under the polifora (Pisani-Moretta), a pier between.
  { split = "x", when = "role == 'water' and gate_pair", parts = [
      { label = "Cell", size = "0.5", name = "x0", slot = "end" },
      { label = "Cell", size = "(w - 1.7) / 2.0", name = "x1", slot = "bay" },
      { label = "Cell", size = "0.7", name = "x2", slot = "end" },
      { label = "Cell", size = "(w - 1.7) / 2.0", name = "x3", slot = "bay" },
      { label = "Cell", size = "0.5", name = "x4", slot = "end" },
  ] },
]

[[production]]
id = "venice.cell"
label = "Cell"
when = "opening_type != 'none'"
do = [ { call = "kit.split_cell_around_its_light" } ]

[[production]]
id = "venice.light_bay"
label = "LightBay"
doc = "A light bay with several lights becomes an arcade. A polifora stands in a rectangular stone frame, with a band of quatrefoil tracery over its arches on the floor that has one; a balcony runs across the foot of any light bay that has one."
let = { lh = "min(light_height, h - sill)", traced = "has('band_h') and band_h > 0" }
do = [
  { call = "kit.split_light_bay_into_lights", when = "has('lights') and lights" },
  { call = "kit.split_light_bay", when = "not (has('lights') and lights)" },
  { insert = "Tracery", at = ["x", "y + sill + lh", "w", "band_h"], name = "tracery", when = "traced" },
  { insert = "Surround", at = ["x", "y + sill", "w", "lh + (band_h if traced else frame_head)"], name = "frame", attrs = { surround_kind = "= frame_kind" }, when = "has('frame_kind') and frame_kind != 'none'" },
  { insert = "Balconette", at = ["x", "y + sill", "w", "0.95"], name = "balcony", when = "has('balcony') and balcony" },
]

[[production]]
id = "venice.light"
label = "Light"
do = [ { call = "kit.dress_the_light" } ]

[[rule]]
id = "venice.roles.the_storey_knows_its_floor"
label = "Storey"
layer = "roles"
doc = "Each storey is the floor the facade gave it; both nobile floors are nobile. The wall is the family's: brick about 40 %, rose stucco 30 %, cream 20 %, ochre the rest; the trim is Istrian stone on all."
set = { role = "= 'nobile' if floor in ('nobile1', 'nobile2') else floor", wall_material = "= palazzo_wall" }

[[rule]]
id = "venice.base.end_piers_are_wall"
label = "Cell"
when = "not is_bay()"
set = { opening_type = "none" }

[[rule]]
id = "venice.base.attic_lights"
label = "Cell"
doc = "An attic's windows are small and square, one on each wing axis."
when = "is_bay() and role == 'attic'"
set = { opening_type = "window", head = "flat", light_width = 0.85, sill = 0.8, light_height = 1.1, surround_kind = "dentil_panel", keystone_present = false }

[[rule]]
id = "venice.base.attic_centre"
label = "Cell"
doc = "Over the polifora an attic opens a small window on the axis of each light below."
when = "is_bay() and in_parent('Centre') and role == 'attic'"
specificity = 10
let = { pw = "w - 0.1", cap = "polifora_cap[klass] + (2 if klass == 'grand' and pw >= 8.5 else 0)", n = "max(3, min(cap, -int(-(pw + polifora_div) // (polifora_light_max + polifora_div))))", lw = "min(polifora_light_max, (pw - polifora_div * (n - 1)) / n)" }
set = { opening_type = "window", head = "flat", light_width = "= n * lw + polifora_div * (n - 1)", sill = 0.8, light_height = 1.1, lights = "= (1.0,) * n", divider = "Pier", divider_width = "= polifora_div", glass_width = 0.8, surround_kind = "dentil_panel", keystone_present = false }

[[rule]]
id = "venice.base.water_storey_lights"
label = "Cell"
doc = "The water storey's lights are small and barred, under a round, pointed or flat head as the family built them; lower where a mezzanine tier stands over them."
when = "is_bay() and role == 'water'"
set = { opening_type = "window", head = "= water_head", light_width = "= 0.9 if mezz else 1.0", sill = "= 1.0 if mezz else 1.4", light_height = "= 1.4 if mezz else 2.2", surround_kind = "dentil_panel", keystone_present = false }

[[rule]]
id = "venice.base.mezzanine_lights"
label = "Cell"
when = "is_bay() and role == 'water' and has('tier') and tier == 'mezz'"
specificity = 5
set = { opening_type = "window", head = "flat", light_width = 0.85, sill = 0.45, light_height = 1.25, surround_kind = "dentil_panel", keystone_present = false }

[[rule]]
id = "venice.base.an_ogee_window"
label = "Cell"
doc = "A wing bay holds one tall light (ogee with a finial, pointed before about 1370) in a stone panel, its sill on the floor. Wing balconettes are the family's, on about half the fronts, on every nobile floor together; stone, unless iron put in later."
when = "is_bay() and role in ('nobile', 'third')"
let = { sl = "0.15 if role == 'nobile' else 0.4" }
set = { opening_type = "window", head = "= nobile_head", light_width = "= wing_light", sill = "= sl", light_height = "= min(h - sl - 1.2, light_slenderness * wing_light)", surround_kind = "dentil_panel", keystone_present = false, finial = true, archivolt = "plain", balcony = "= wing_balconies", rail = "= 'iron' if wing_iron or role == 'third' else 'stone'", glazing = "= 'scuri' if (seed * 7 + int(x * 10)) % 5 == 0 else glaze" }

[[rule]]
id = "venice.base.the_polifora"
label = "Cell"
doc = "On a nobile floor the centre is one opening of slender lights on colonnettes: a light about a metre wide and two and a half to three times as tall, as many of them as fill the centre, capped by what the house can afford (where the cap bites, the polifora is narrower than the centre, wall either side); the same count on both nobile floors, two fewer on a third floor, whose lights stay as slender (a smaller polifora, not broader lights). In a dentilled Istrian frame; quatrefoil tracery rising from its arch tips on the floor the family chose; a stone balcony on corbels under it on the first nobile floor, and on the second in most houses."
when = "is_bay() and in_parent('Centre') and role in ('nobile', 'third')"
specificity = 10
# Never a broad light: no wider than polifora_light_max, nor wider than its
# height allows at light_min_slender. The count fills the centre at that
# width, up to the cap; a third floor takes two fewer and stays slender.
let = { pw = "w - 0.1", sl = "0.15 if role == 'nobile' else 0.4", room = "h - sl - 1.2", cap = "polifora_cap[klass] + (2 if klass == 'grand' and pw >= 8.5 else 0)", n_nob = "max(3, min(cap, -int(-(pw + polifora_div) // (polifora_light_max + polifora_div))))", n = "n_nob if role == 'nobile' else max(3, n_nob - 2)", lw = "min(polifora_light_max, room / light_min_slender, (pw - polifora_div * (n - 1)) / n)" }
set = { opening_type = "window", head = "= nobile_head", light_width = "= n * lw + polifora_div * (n - 1)", sill = "= sl", light_height = "= min(room, light_slenderness * lw)", lights = "= (1.0,) * n", divider = "Colonnette", divider_width = "= polifora_div", capital_width = 0.42, order = "colonnette", surround_kind = "none", frame_kind = "dentil_panel", finial = true, archivolt = "plain", band_h = "= tracery_h if floor in tracery_on else 0.0", balcony = "= floor == 'nobile1' or (floor == 'nobile2' and pn2_balcony)", rail = "stone", glazing = "= glaze" }


[[rule]]
id = "venice.base.the_water_gate"
label = "Cell"
doc = "The middle of the water storey is the gate the boats come in by: 2 to 3 m wide, about twice as tall as it is wide, an open arch (pointed, ogee or round) with an iron grille in its head, in a dentilled stone frame kept inside the water storey."
when = "is_bay() and in_parent('Centre') and role == 'water' and is_middle_bay() and not gate_pair"
specificity = 20
set = { opening_type = "water_gate", head = "= gate_head", light_width = "= min(w - 0.4, gate_w[1])", sill = 0.0, light_height = "= min(h - 0.9, 2.0 * min(w - 0.4, gate_w[1]) + 0.2)", surround_kind = "dentil_panel", finial = true }

[[rule]]
id = "venice.base.a_pair_of_gates"
label = "Cell"
doc = "Two gates side by side under the polifora, a pier between them (Pisani-Moretta)."
when = "is_bay() and in_parent('Centre') and role == 'water' and gate_pair"
specificity = 20
set = { opening_type = "water_gate", head = "= gate_head", light_width = "= min(w - 0.4, gate_w[1])", sill = 0.0, light_height = "= min(h - 0.9, 2.0 * min(w - 0.4, gate_w[1]) + 0.2)", surround_kind = "dentil_panel", finial = true }

# === The Veneto-Byzantine casa-fondaco (before 1300) =============================

[[production]]
id = "venice.byzantine_lot"
label = "Lot"
when = "year < byzantine_until"
doc = "The casa-fondaco: a body of two arcaded storeys. Only the grand fondaco type stands between two corner towers and is crenellated (as restored); the others are faced in Istrian stone (about 45 %) or plastered, cream or rose, with stone arcades. The family (the seed) settles what the survivors differ in: how many arches its centre arcade has (two fewer, or two more where the front holds them, than the width alone gives), how much of the front the arcade takes, how low its wing windows come, and whether a band of paterae runs between the floors."
let = { fondaco = "klass == 'grand' and width >= fondaco_from", tw = "max(2.8, width * torresella_share)", u_wall = "(seed * 41 + 17) % 100" }
do = [
  { set = { crenellated = "= fondaco", winged = "= not fondaco", palazzo_wall = "= 'stone' if fondaco or u_wall < 45 else ('stucco' if u_wall < 75 else 'stucco_rose')", arcade_shift = "= -2 if (seed * 29 + 7) % 100 < 35 else (2 if (seed * 29 + 7) % 100 >= 80 and not fondaco else 0)", wing_sill = "= [1.1, 0.7, 1.5][(seed * 19 + 5) % 3]", arcade_share = "= 0.62 if fondaco else 0.54 + 0.02 * ((seed * 13 + 3) % 5)", frieze_on = "= fondaco or (seed * 47 + 21) % 100 < 65", parapet = "= fondaco or (seed * 37 + 9) % 100 < pluteus_share" } },
  { split = "x", when = "fondaco", parts = [
      { label = "Torresella", size = "tw", name = "tower_left", attrs = { side = "left" } },
      { label = "Body", size = "w - 2 * tw", name = "body" },
      { label = "Torresella", size = "tw", name = "tower_right", attrs = { side = "right" } },
  ] },
  { split = "x", when = "not fondaco", parts = [ { label = "Body", size = "w", name = "body" } ] },
]

[[production]]
id = "venice.byzantine_body"
label = "Body"
doc = "The body: the portico over the water, the arcade above it, a cornice, and the crenellation on the fondaco."
do = [
  { split = "y", parts = [
      { label = "Storey", size = "portico_h[klass]", name = "s0", attrs = { floor = "portico" } },
      { label = "Storey", size = "loggia_h[klass]", name = "s1", attrs = { floor = "loggia" } },
      { repeat = "[merlon_h] if crenellated else []", label = "Merlons", size = "item", name = "merlons" },
      { label = "Sky", size = "h - portico_h[klass] - loggia_h[klass] - (merlon_h if crenellated else 0.0)", name = "sky" },
  ] },
]

[[production]]
id = "venice.torresella"
label = "Torresella"
doc = "A corner tower: the water storey, the arcade storey, and one more over the cornice; its inner edge a plain stone arris where it stands forward."
do = [
  { split = "y", parts = [
      { label = "Storey", size = "portico_h[klass]", name = "s0", attrs = { floor = "tower_water" } },
      { label = "Storey", size = "loggia_h[klass]", name = "s1", attrs = { floor = "tower_loggia" } },
      { label = "Storey", size = "tower_top_h", name = "s2", attrs = { floor = "tower_top" } },
      { repeat = "[merlon_h] if crenellated else []", label = "Merlons", size = "item", name = "merlons" },
      { label = "Sky", size = "h - portico_h[klass] - loggia_h[klass] - tower_top_h - (merlon_h if crenellated else 0.0)", name = "sky" },
  ] },
  { insert = "Column", at = ["x + w - 0.3 if side == 'left' else x", "y", "0.3", "portico_h[klass] + loggia_h[klass] + tower_top_h"], name = "edge", attrs = { order = "arris" } },
]

[[production]]
id = "venice.arcade_storey"
label = "Storey"
when = "not in_parent('Facade')"
doc = "A Byzantine storey of the body is grouped centre and wings: an odd centre arcade between two wider piers, and in each wing one or two arches; on the fondaco the body is all centre and the towers are its wings. A tower storey is one opening between wider piers. A string course over the portico with a band of paterae and formelle under it; a dentilled cornice on the body's top storey and the tower's."
let = { pier = "arcade_end if role in ('portico', 'loggia') else w * 0.22", avail = "w - 2 * arcade_end" }
do = [
  { let = { nc = "min(9 if not winged else 7, max(3, 2 * int((avail * (0.6 if winged else 1.0) / portico_arch) / 2) + 1 + arcade_shift))" } },
  { let = { cw = "min(nc * portico_arch, avail * arcade_share) if winged else avail" } },
  { let = { ww = "(avail - cw - 2 * wing_pier) / 2.0 if winged else 0.0" } },
  { set = { arches = "= nc", wing_arches = "= max(1, min(2, round(ww / 1.6)))" } },
  { split = "x", when = "role in ('portico', 'loggia') and winged", parts = [
      { label = "Cell", size = "arcade_end", name = "x0", slot = "end" },
      { label = "Cell", size = "ww", name = "x1", slot = "bay", attrs = { part = "wing" } },
      { label = "Cell", size = "wing_pier", name = "x2", slot = "end" },
      { label = "Cell", size = "cw", name = "x3", slot = "bay", attrs = { part = "centre" } },
      { label = "Cell", size = "wing_pier", name = "x4", slot = "end" },
      { label = "Cell", size = "ww", name = "x5", slot = "bay", attrs = { part = "wing" } },
      { label = "Cell", size = "arcade_end", name = "x6", slot = "end" },
  ] },
  { split = "x", when = "not (role in ('portico', 'loggia') and winged)", parts = [
      { label = "Cell", size = "pier", name = "x0", slot = "end" },
      { label = "Cell", size = "w - 2 * pier", name = "x1", slot = "bay", attrs = { part = "centre" } },
      { label = "Cell", size = "pier", name = "x2", slot = "end" },
  ] },
  { insert = "Cornice", at = ["x", "y + h", "w", "0.4"], name = "cornice", attrs = { cornice_ornament = "modillioned" }, when = "role in ('loggia', 'tower_top')" },
  { insert = "Entablature", at = ["x", "y + h - 0.16", "w", "0.16"], name = "string_course", attrs = { course_kind = "dentil" }, when = "role in ('portico', 'tower_water', 'tower_loggia')" },
  { insert = "Frieze", at = ["x + pier", "y + h - 0.78", "w - 2 * pier", "0.56"], name = "frieze", when = "role == 'portico' and frieze_on" },
  { insert = "BaseCourse", at = ["x", "y", "w", "riva_h"], name = "riva", attrs = { rows = 1 }, when = "role in ('portico', 'tower_water')" },
]

[[rule]]
id = "venice.roles.istrian_stone"
label = "Storey"
layer = "roles"
specificity = 10
doc = "A Byzantine front is faced in white Istrian stone (the Fondaco, Loredan) or plastered with its arcades in stone (Farsetti, da Mosto)."
when = "floor in ('portico', 'loggia', 'tower_water', 'tower_loggia', 'tower_top')"
set = { wall_material = "= palazzo_wall" }

[[rule]]
id = "venice.byzantine.the_portico"
label = "Cell"
doc = "The water storey's centre is an open portico of round stilted arches on columns with basket capitals, an odd number, graded: the middle arch widest, the outer two narrowest. Paterae in the spandrels."
when = "is_bay() and role == 'portico' and part == 'centre'"
set = { opening_type = "open_arch", head = "round", light_width = "= w", sill = "= riva_h", light_height = "= h - 0.9 - riva_h", lights = "= (0.85,) + (1.0,) * ((arches - 3) // 2) + (1.2,) + (1.0,) * ((arches - 3) // 2) + (0.85,)", divider = "Colonnette", divider_width = 0.42, capital_width = 0.62, order = "byzantine", stilt = 0.35, spandrel_patera = true, archivolt = "extradosed", surround_kind = "none", keystone_present = false }

[[rule]]
id = "venice.byzantine.the_portico_wings"
label = "Cell"
doc = "Each wing of the portico is wall pierced by one or two windowed round arches."
when = "is_bay() and role == 'portico' and part == 'wing'"
set = { opening_type = "window", head = "round", light_width = "= w - 0.3", sill = "= wing_sill", light_height = "= h - 0.9 - wing_sill", lights = "= (1.0,) * wing_arches", divider = "Colonnette", divider_width = 0.3, capital_width = 0.44, order = "byzantine", stilt = 0.3, spandrel_patera = false, archivolt = "extradosed", surround_kind = "none", keystone_present = false }

[[rule]]
id = "venice.byzantine.the_arcade"
label = "Cell"
doc = "The floor above is a continuous arcade of stilted round arches, 2n - 1 over the portico's n, on slender columns behind a parapet of solid marble plutei (or open, as the family had it); in each wing one more arch than below. Every stilted arch carries a thin extradosed archivolt, run down its stilt to the impost."
when = "is_bay() and role == 'loggia'"
set = { opening_type = "window", head = "round", light_width = "= w", sill = 0.95, light_height = "= h - 0.95 - 0.45", lights = "= (1.0,) * ((2 * arches - 1) if part == 'centre' else (wing_arches + 1))", divider = "Colonnette", divider_width = 0.22, capital_width = 0.34, order = "byzantine", stilt = 0.25, spandrel_patera = true, archivolt = "extradosed", surround_kind = "none", keystone_present = false, balcony = "= parapet", rail = "plutei" }

[[rule]]
id = "venice.byzantine.tower_openings"
label = "Cell"
doc = "A tower's openings continue the arcades beside it: two or three arches at the portico's pitch below, four at the loggia's above, four or five small ones in its top storey."
when = "is_bay() and role in ('tower_water', 'tower_loggia', 'tower_top')"
set = { opening_type = "= 'open_arch' if role == 'tower_water' else 'window'", head = "round", light_width = "= w", sill = "= riva_h if role == 'tower_water' else 0.95", light_height = "= h - 0.9 - riva_h if role == 'tower_water' else h - 0.95 - 0.6", lights = "= (1.0,) * (max(2, min(3, round(w / portico_arch))) if role == 'tower_water' else (4 if role == 'tower_loggia' else (5 if w >= 3.9 else 4)))", divider = "Colonnette", divider_width = "= 0.42 if role == 'tower_water' else 0.22", capital_width = "= 0.6 if role == 'tower_water' else 0.32", order = "byzantine", stilt = "= 0.35 if role == 'tower_water' else 0.2", spandrel_patera = "= role != 'tower_top'", archivolt = "extradosed", surround_kind = "none", keystone_present = false, balcony = "= role == 'tower_loggia' and parapet", rail = "plutei" }
