# The Paris immeuble, as rules -- the same kind of file as every other style.
#
# This is NOT the measured Paris generator (generate.py, which reads Daly's
# plates through 14 000 lines of structure, qualification and termination).
# It is the Haussmann building written the way Georgian, Kyoto or Venice are:
# the regulations as step tables, the class as an ambition, the storeys and
# the bays fitted, and the vocabulary laid on by rules. Expect it to agree
# with the measured generator on shape and to differ in the second decimal.

[style]
name = "haussmann"
site = ["street_width", "parcel_width", "year", "klass", "ground", "corner", "seed"]
axiom = { w = "parcel_width", h = 40 }
overhangs = ["Cornice", "Chimney"]
describe = { rule = "haussmann.reglement", phase = "regulation", detail = "f'Paris immeuble, {street_width:.0f} m street, legal cornice {step(steps_1859 if year < 1884 else steps_1884, street_width) if year >= 1859 else step(steps_royal, street_width):.2f} m, {year}, {klass}'" }

[lot_props]
year = "= year"

[emit]
Balconette = "haussmann.balconette"
Rail = "kit.column"
Bar = "kit.column"
Rosette = "kit.column"
Slant = "grow.slant"
Rustication = "haussmann.rustication"
Storey = "haussmann.storey"

[params]
# The facade height a street allows, as each regulation's step table:
# [street width up to, cornice height]. The same limits reglement.py states;
# the review's reading of the boundary wording ("less than 7.80 m", R14) is
# recalled, not sourced, so both files keep the inclusive bounds until the
# decree text is checked.
steps_royal = [[7.8, 11.7], [9.75, 14.62], [999.0, 17.55]]     # 1783
steps_1859  = [[7.8, 11.7], [9.75, 14.62], [20.0, 17.55], [999.0, 20.0]]
steps_1884  = [[7.8, 12.0], [9.75, 15.0], [20.0, 18.0], [999.0, 20.0]]
# How much of that the owner built: ambition, by class. INFERRED.
ambition = { modest = 0.86, ordinary = 0.9, comfortable = 0.95, grand = 0.98 }
shop_ground = 4.0
house_ground = 4.0              # R4 (S2)
# What stands between the ground storey and the noble floor (R4): a drawn
# choice by class and programme, [entresol, low dressed first, nothing].
mid_kinds = ["entresol", "low_first", "none"]
mid_h = { entresol = 3.0, low_first = 3.4, none = 0.0 }
mid_weights = { grand = { shop = [0.6, 0.4, 0.0], house = [0.0, 0.8, 0.2] }, comfortable = { shop = [0.9, 0.05, 0.05], house = [0.3, 0.5, 0.2] }, ordinary = { shop = [0.8, 0.0, 0.2], house = [0.2, 0.2, 0.6] }, modest = { shop = [0.3, 0.0, 0.7], house = [0.0, 0.0, 1.0] } }
# The noble floor by class (R3, Daly medians and ranges), and the letting floor.
principal = { grand = [3.9, 4.3], comfortable = [3.6, 4.1], ordinary = [3.3, 3.5], modest = [3.0, 3.1] }
upper = { grand = 3.45, comfortable = 3.1, ordinary = 3.0, modest = 2.9 }
taper = 0.95                    # each letting floor this fraction of the one below
bay = [2.1, 2.8, 3.5]           # the masonry's rhythm (R19, Daly)
end = [0.2, 0.35, 0.75]
# Windows (R5): one absolute width; the class is in the noble floor's height.
light_w = [1.1, 1.3]
noble_light_h = { grand = 2.9, comfortable = 2.25, ordinary = 2.15, modest = 2.1 }
light_aspect = 1.9
balcony_deck_min = 6.0          # 1823: no projecting balcony with its deck under 6 m
# Balconies (R6): a filant on the noble floor and on the top floor, by class.
noble_filant_extent = { full = 0.8, central = 0.2 }   # photo check B2
letting_balconies = [[1859, [1.0, 0.0, 0.0]], [9999, [0.4, 0.35, 0.25]]]   # [rails, grouped, per window], photo check R2
pediment_floor = { noble = 0.3, above = 0.25, none = 0.45 }   # photo check R11
p_noble_filant = { grand = 0.85, comfortable = 0.85, ordinary = 0.5, modest = 0.1 }
p_top_filant = { grand = 0.85, comfortable = 0.8, ordinary = 0.6, modest = 0.4 }
# The comble (R8): one level or two, by date and envelope.
h_comble_one = { before_1884 = 3.2, after_1884 = 4.0 }
h_comble_two = { before_1884 = 4.6, after_1884 = 5.6 }   # blind judges: 6.5 m read 1.7-2.2 storeys too tall
# Dormers (R9): every axis or every other, by class; the form by class and date.
every_axis = { grand = 0.75, comfortable = 0.75, ordinary = 0.4, modest = 0.4 }
dormer_forms = { rich = { pedimented = 0.35, segmental = 0.3, oeil_de_boeuf = 0.2, flat_lucarne = 0.15 }, plain = { flat_lucarne = 0.5, segmental = 0.3, round_arched = 0.2 } }
# The entrance (R12, R13): cochere or pietonne by class; position by parity.
cochere = { grand = 1.0, comfortable = 0.35, ordinary = 0.15, modest = 0.0 }
cochere_wide = { grand = 1.0, comfortable = 0.7, ordinary = 0.4, modest = 0.1 }   # a front of 16 m or more (the judges: a window-sized door on a wide front)
# The base's stone: refends (channelled joints) from 1853 on most fronts (R16).
rusticated = 0.8
course = 0.42                   # one course of the socle
cornice_h = 0.85                # the crowning cornice, on modillions
# Cast-iron railings, grown (paris.railing): the motif by date -- plain bars
# under the Restauration, lozenge-and-rosette panels under the Second Empire,
# bars with a crossed panel under the Third Republic. [bars, lozenge, cross].
railing_motifs = [[1849, [1.0, 0.0, 0.0]], [1879, [0.3, 0.7, 0.0]], [9999, [0.2, 0.3, 0.5]]]
rail_h = 0.05
iron_bar = 0.025
panel_w = 0.55

# --- productions ---------------------------------------------------------------

[[production]]
id = "haussmann.lot"
label = "Lot"
doc = "The legal envelope: the cornice the street allows, built to the owner's ambition, a drawn base, and a comble over it that keeps to its regulation's profile."
let = { legal = "step(steps_royal, street_width) if year < 1859 else step(steps_1859 if year < 1884 else steps_1884, street_width)", shop = "ground in ('shop', 'cafe')" }
do = [
  { let = { ground_h = "shop_ground if shop else house_ground", target = "legal * ambition[klass]", up = "upper[klass]" } },
  { let = { mid = "draw('mid', mid_kinds, mid_weights[klass]['shop' if shop else 'house'])", noble = "between('noble', principal[klass][0], principal[klass][1])" } },
  # The stone never rises past the legal cornice (R14): shed the letting
  # floors first, then the entresol, then shorten the noble floor.
  { let = { mid = "mid if ground_h + mid_h[mid] + noble <= legal else 'none'" } },
  { let = { noble = "min(noble, legal - ground_h - mid_h[mid])" } },
  { let = { base = "ground_h + mid_h[mid]" } },
  # The most letting floors the remaining height holds, tapering: the sum of
  # up * taper^i for i < k stays within it.
  { let = { q = "1 - (legal - base - noble) * (1 - taper) / up" } },
  { let = { kmax = "99 if q <= 0 else floor(log2(q) / log2(taper) + 1e-9)" } },
  { let = { lettings = "max(0, min(round((target - base - noble) / (up * 0.95)), kmax))" } },
  { set = { base_h = "= base", mid = "= mid", noble_h = "= noble", lettings = "= lettings", shop = "= shop", up_h = "= up" } },
  { let = { front = "base + noble + fsum(geometric(up, taper, lettings))" } },
  { fit = "x", end = "end", bay = "bay", as = "rhythm", min_bays = 2 },
  { set = { motif = "= draw('railing_motif', [0, 1, 2], step(railing_motifs, year))", light_width = "= between('light_w', light_w[0], light_w[1])", noble_filant = "= chance('noble_filant', p_noble_filant[klass])", top_filant = "= chance('top_filant', p_top_filant[klass])", door = "= 'cochere' if chance('cochere', (cochere_wide if w >= 16 else cochere)[klass]) else 'pietonne'", refends = "= year >= 1853 and chance('refends', rusticated)", filant_extent = "= draw('filant_extent', noble_filant_extent)", pediments = "= draw('pediments', pediment_floor) if klass in ('grand', 'comfortable') else 'none'" } },
  # The entrance by parity (R13): the middle of an odd run, or one of the outer
  # bays of an even one.
  { let = { nb = "len(bay_spans(rhythm, 0.0))" } },
  { set = { door_bay = "= draw('door_odd', [nb // 2, 0, nb - 1, 1, nb - 2], [0.4, 0.175, 0.175, 0.125, 0.125]) if nb % 2 == 1 else draw('door_even', [0, nb - 1, 1, nb - 2], [0.2, 0.2, 0.3, 0.3])" } },
  # The comble (R8): before 1884 a brisis and a low terrasson inside the 45
  # degree line; after, the taller arc and a steeper break. Two levels when the
  # envelope allows.
  { let = { pre = "year < 1884", two = "chance('two_level_comble', (0.4 if legal >= 17.55 and street_width >= 20 else 0.1) if year < 1884 else 0.6)" } },
  { set = { comble_two = "= two" } },
  { insert = "Facade", at = ["0.0", "0.0", "w", "front"], name = "facade" },
  { insert = "Roof", at = ["0.0", "front", "w", "(h_comble_two.before_1884 if pre else h_comble_two.after_1884) if two else (h_comble_one.before_1884 if pre else h_comble_one.after_1884)"], name = "roof", attrs = { pitch = "= 45.0", lower_pitch = "= (45.0 if two else 60.0) if pre else 72.0", upper_pitch = "= (45.0 if two else 20.0) if pre else 30.0", break_pct = "= (1.0 if two else 0.4) if pre else 0.65", roof_material = "zinc_roofing", dormer_form = "= draw('dormer_form', dormer_forms['rich' if klass in ('grand', 'comfortable') else 'plain'])" } },
]

[[production]]
id = "haussmann.facade"
label = "Facade"
doc = "The storeys: the ground floor, what stands over it, the noble floor and the letting floors, which shorten as they climb."
do = [
  { split = "y", id_base = "parent", parts = [
      { label = "Storey", size = "shop_ground if shop else house_ground", name = "s{n}", attrs = { floor = "ground" } },
      { repeat = "[mid_h[mid]] if mid != 'none' else []", label = "Storey", size = "item", name = "s{n}", attrs = { floor = "= mid" } },
      { label = "Storey", size = "noble_h", name = "s{n}", attrs = { floor = "principal" } },
      { repeat = "geometric(up_h, taper, lettings)", label = "Storey", size = "item", name = "s{n}", attrs = { floor = "letting" } },
  ] },
]

[[production]]
id = "haussmann.storey"
label = "Storey"
doc = "A storey is cut by the one rhythm. The base block is crowned by an entablature; a balcon filant fronts the noble floor (never with its deck under 6 m) and the top floor where the owner built them; the cornice crowns the stone."
do = [
  { split = "x", by = "rhythm", label = "Cell" },
  { insert = "Entablature", at = ["x", "y + h - 0.45", "w", "0.45"], name = "base_entablature", attrs = { course_kind = "entablature" }, when = "role == 'base' and index == base_top" },
  { let = { spans = "bay_spans(rhythm, x)", filant = "(role == 'principal' and noble_filant and y >= balcony_deck_min) or (role == 'upper' and index == count - 1 and top_filant)" } },
  # The noble filant runs the full front, or only across the middle bays.
  { let = { central = "role == 'principal' and filant_extent == 'central' and len(spans) >= 4" } },
  { insert = "Balconette", at = ["x", "y", "w", "1.0"], name = "balcon_filant", when = "filant and not central" },
  { insert = "Balconette", at = ["spans[1].x", "y", "spans[-2].x + spans[-2].w - spans[1].x", "1.0"], name = "balcon_filant", when = "filant and central" },
  # A letting floor between: rails only, a grouped balcony over the middle
  # bays, or a balcony at each window (by date, drawn per floor).
  { let = { lb = "draw('letting_balcony', ['rails', 'grouped', 'each'], step(letting_balconies, year), per='Storey') if role == 'upper' and not filant else 'rails'" } },
  { insert = "Balconette", at = ["spans[1].x", "y", "spans[-2].x + spans[-2].w - spans[1].x", "1.0"], name = "balcon_group", when = "lb == 'grouped' and len(spans) >= 4" },
  # Without a balcony before it, every porte-fenetre has its garde-corps
  # across the light (or a small balcony of its own), from the storey so its
  # iron stands in front of the wall.
  { each = "range(len(spans))", when = "role in ('principal', 'upper') and not (filant and not central)", do = [
      { let = { sp = "spans[item]", covered = "(central or (lb == 'grouped' and len(spans) >= 4)) and 0 < item < len(spans) - 1" } },
      { insert = "Balconette", at = ["sp.x + sp.w / 2.0 - light_width / 2.0 - 0.15", "y", "light_width + 0.3", "1.0"], name = "balcony_win{i}", when = "lb == 'each' and not covered" },
      { insert = "Balconette", at = ["sp.x + sp.w / 2.0 - light_width / 2.0", "y + 0.1", "light_width", "0.9"], name = "garde_corps{i}", when = "lb != 'each' and not covered" },
  ] },
  { insert = "Cornice", at = ["x", "y + h", "w", "cornice_h"], name = "cornice", attrs = { cornice_ornament = "modillioned" }, when = "index == count - 1" },
  # The base in channelled stone, laid on the wall before its openings.
  { insert = "Rustication", at = ["x", "y", "w", "h - (0.45 if index == base_top else 0.0)"], name = "refends", when = "role == 'base' and refends", attrs = { treatment = "flat_incised_refends", course_columns = 1, course_rows = "= max(1, round(h / course))" } },
]

[[production]]
id = "haussmann.roof"
label = "Roof"
doc = "A lucarne over every window axis of the stone below, or every other on a plainer house, and a stack on each party wall. A two-level comble holds a second storey of chambres de bonne, lit by a smaller row above."
do = [
  { let = { axes = "bay_centres(rhythm, x)", all_axes = "chance('every_axis', every_axis[klass])" } },
  { let = { axes = "axes if all_axes or len(axes) < 3 else every_other(axes)" } },
  { each = "axes", do = [
      { insert = "Dormer", at = ["item - 0.6", "y + 0.4", "1.2", "min(1.9, h - 0.8)"], name = "dormer{i}" },
  ] },
  { each = "axes", when = "comble_two", do = [
      { insert = "Dormer", at = ["item - 0.45", "y + h * 0.58", "0.9", "1.35"], name = "upper_dormer{i}", attrs = { dormer_form = "segmental" } },
  ] },
  { insert = "Chimney", at = ["0.1", "y + h", "0.9", "1.1"], name = "chimney0" },
  { insert = "Chimney", at = ["w - 1.0", "y + h", "0.9", "1.1"], name = "chimney1" },
]

[[production]]
id = "haussmann.cell"
label = "Cell"
when = "opening_type != 'none'"
do = [ { call = "kit.split_cell_around_its_light" } ]

[[production]]
id = "haussmann.light_bay"
label = "LightBay"
doc = "The light (its garde-corps is put up by the storey)."
do = [ { call = "kit.split_light_bay" } ]

[[production]]
id = "haussmann.light"
label = "Light"
do = [ { call = "kit.dress_the_light" } ]

[[production]]
id = "haussmann.railing"
label = "Balconette"
doc = "Cast-iron railing, grown: paris.railing frames it in a top and bottom rail and cuts it into near-square panels, then fills each with the motif of its date."
do = [ { grow = "paris.railing", generations = 3, params = { n = "max(1, round(w / panel_w))", m = "motif", rail = "rail_h", bar = "iron_bar" } } ]

# --- the railings, grown -----------------------------------------------------------
#
# Paris balcony and garde-corps iron (the photo corpus's se-ironwork family):
# a top rail and a bottom rail, standards dividing panels about 0.55 m wide,
# and in each panel the motif of the date.

[[lsystem]]
id = "paris.railing"
doc = "A cast-iron railing: rails, panels, and each panel's motif."
axiom = "Railing"
rules = [
  { id = "paris.railing.framed", pred = "Railing", to = "Frame Inset [ Rx(n) [ Panel ] ]" },
  { id = "paris.railing.bars", pred = "Panel", when = "m == 0", to = "Post Bars(3)" },
  { id = "paris.railing.lozenge", pred = "Panel", when = "m == 1", to = "Post Bars(1) Lozenge Rosette" },
  { id = "paris.railing.crossed", pred = "Panel", when = "m == 2", to = "Post Cross Rosette" },
]
interpret = [
  { module = "Frame", do = [
      { place = "Rail", at = ["0", "ch - rail", "cw", "rail"], attrs = { order = "timber" } },
      { place = "Rail", at = ["0", "0", "cw", "rail"], attrs = { order = "timber" } },
  ] },
  { module = "Inset", inset = "[0, rail, 0, rail]" },
  { module = "Rx(k)", repeat = "x", n = "k" },
  { module = "Post", place = "Bar", at = ["0", "0", "bar * 1.6", "ch"], attrs = { order = "timber" } },
  { module = "Bars(k)", each = "range(k)", place = "Bar", at = ["(item + 1) * cw / (k + 1) - bar / 2", "0", "bar", "ch"], attrs = { order = "timber" } },
  { module = "Lozenge", do = [
      { line = ["cw / 2", "ch * 0.1", "cw * 0.9", "ch / 2"], width = "bar", attrs = { stroke_w = 0.9 } },
      { line = ["cw * 0.9", "ch / 2", "cw / 2", "ch * 0.9"], width = "bar", attrs = { stroke_w = 0.9 } },
      { line = ["cw / 2", "ch * 0.9", "cw * 0.1", "ch / 2"], width = "bar", attrs = { stroke_w = 0.9 } },
      { line = ["cw * 0.1", "ch / 2", "cw / 2", "ch * 0.1"], width = "bar", attrs = { stroke_w = 0.9 } },
  ] },
  { module = "Cross", do = [
      { line = ["bar * 2", "0", "cw", "ch"], width = "bar", attrs = { stroke_w = 0.9 } },
      { line = ["bar * 2", "ch", "cw", "0"], width = "bar", attrs = { stroke_w = 0.9 } },
  ] },
  { module = "Rosette", place = "Rosette", at = ["cw / 2 - 0.05", "ch / 2 - 0.05", "0.1", "0.1"], attrs = { order = "timber" } },
]

# --- roles: identity from the stack ---------------------------------------------

[[layer]]
name = "roles"
order = 0

[[layer]]
name = "base"
order = 0

[[layer]]
name = "class"
order = 20

[[rule]]
id = "haussmann.roles.from_the_stack"
label = "Storey"
layer = "roles"
doc = "The ground floor and any entresol are the base; the noble floor is the principal; the rest let."
set = { role = "= 'base' if floor in ('ground', 'entresol', 'low_first') else 'principal' if floor == 'principal' else 'upper'", wall_material = "stone", base_top = "= 0 if mid == 'none' else 1" }

# --- the cells -------------------------------------------------------------------

[[rule]]
id = "haussmann.base.end_piers_are_wall"
label = "Cell"
when = "not is_bay()"
set = { opening_type = "none" }

[[rule]]
id = "haussmann.base.window_takes_its_share_of_the_bay"
label = "Cell"
doc = "Every etage window is a porte-fenetre of one absolute width (R1, R5): the noble floor's height set by the class, the letting floors' by an aspect that shortens as they climb, and a garde-corps across every one that has no balcony before it."
when = "is_bay() and role in ('principal', 'upper')"
let = { top = "index == count - 1", lh = "noble_light_h[klass] if role == 'principal' else min(light_width * light_aspect, h - 0.1 - 0.6)" }
set = { opening_type = "window", head = "flat", light_width = "= min(light_width, w - 0.3)", sill = 0.1, light_height = "= min(lh, noble_light_h[klass] * 0.7) if top and role == 'upper' else lh", surround_kind = "moulded_architrave", keystone_present = "= role == 'principal'", garde_corps = "= not ((role == 'principal' and noble_filant and y >= balcony_deck_min) or (top and top_filant))" }

[[rule]]
id = "haussmann.base.the_shop"
label = "Cell"
doc = "A shop's ground floor is glass between the piers, under a fascia."
when = "is_bay() and floor == 'ground' and shop"
set = { opening_type = "shop_bay", head = "flat", light_width = "= w * 0.86", sill = 0.3, light_height = "= h - 0.3 - 0.9", surround_kind = "none", keystone_present = false }

[[rule]]
id = "haussmann.base.entresol_lights"
label = "Cell"
doc = "The entresol is lit by squat, square-headed windows in the base's own stone."
when = "is_bay() and floor == 'entresol'"
set = { opening_type = "window", head = "flat", light_width = "= min(light_width, w - 0.3)", sill = 0.5, light_height = "= h - 0.5 - 0.55", surround_kind = "none", keystone_present = false }

[[rule]]
id = "haussmann.base.low_first_lights"
label = "Cell"
doc = "A low dressed first floor (R4) between the ground and the noble floor: porte-fenetres on a short allege, framed, without the noble floor's height."
when = "is_bay() and floor == 'low_first'"
set = { opening_type = "window", head = "flat", light_width = "= min(light_width, w - 0.3)", sill = 0.5, light_height = "= h - 0.5 - 0.6", surround_kind = "moulded_architrave", keystone_present = false }

[[rule]]
id = "haussmann.base.house_ground"
label = "Cell"
doc = "A house's ground floor has square-headed windows on an allege."
when = "is_bay() and floor == 'ground' and not shop"
set = { opening_type = "window", head = "flat", light_width = "= min(light_width, w - 0.3)", sill = 1.0, light_height = "= h - 1.0 - 0.55", surround_kind = "none", keystone_present = true }

[[rule]]
id = "haussmann.base.the_porte_cochere"
label = "Cell"
doc = "The entrance stands on the bay the lot drew (the middle of an odd run, an outer bay of an even one): a porte cochere under a round arch, by the owner's class, or a porte pietonne."
when = "is_bay() and floor == 'ground' and nth - 1 == door_bay"
specificity = 20
let = { cochere = "door == 'cochere'" }
set = { opening_type = "pedestrian_entrance", head = "= 'round' if cochere else 'flat'", light_width = "= 2.6 if cochere else 1.4", sill = 0.0, light_height = "= h - 0.35", surround_kind = "moulded_architrave", keystone_present = "= cochere" }

[[rule]]
id = "haussmann.class.the_noble_floor_is_pedimented"
label = "Cell"
layer = "class"
doc = "A comfortable or grand owner crowns one floor's windows with pediments: the noble floor, the one above it, or none (photo check R11)."
when = "is_bay() and ((role == 'principal' and pediments == 'noble') or (role == 'upper' and pediments == 'above' and index == count - lettings))"
set = { surround_kind = "pedimented" }
